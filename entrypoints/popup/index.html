<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfred for Shopify - Popup</title>
    <meta name="manifest.type" content="browser_action" />
    <style>
      :root {
        color-scheme: light;
        /* Backgrounds: sidebar recedes < canvas < cards lift; insets recede */
        --bg: #fff; /* cards, active tab, inputs, dropdowns (the lift surface) */
        --bg-canvas: #fbfcfd; /* popup + content base: soft off-white, eases glare */
        --bg-raised: #f4f6f8; /* sidebar / footers / code (recede) */
        --bg-inset: #eef1f5; /* wells: chips, tracks, h5/h6 badges */
        --bg-hover: #e9edf3;

        /* Borders */
        --border: #e9eaef;
        --border-subtle: #eef0f3;
        --border-muted: #f2f3f6;
        --border-hover: #ccd0d8;
        --border-strong: #dadde3;

        /* Text: distinct, ordered tiers, all AA on white (faint = decorative tier) */
        --text: #1d1d22;
        --text-secondary: #4d515b;
        --text-muted: #656b78;
        --text-faint: #828892;
        --text-disabled: #b3b8c0;
        --text-placeholder: #8b909b;

        /* Interactive (sidebar tabs = muted gray) */
        --text-link: #656b78;
        --text-link-hover: #3a3e47;
        --text-link-muted: #656b78;
        --text-link-muted-hover: #4d515b;
        --text-label: #656b78;

        /* Accent: calm desaturated indigo = the interactive role
           (green is reserved for the brand logo + success semantics) */
        --accent: #4f57c4;
        --accent-strong: #3f47b3;
        --accent-tint: #eef0fb;

        /* Buttons */
        --btn-bg: #1d1d22;
        --btn-bg-hover: #34343c;
        --btn-text: #fff;

        /* Semantic: success (muted green, AA on tint) */
        --success: #1a9d51;
        --success-strong: #15783f;
        --success-bg: #e7f5ec;

        /* Semantic: warning (amber, AA on tint) */
        --warning: #9a5a08;
        --warning-bg: #f9f0db;

        /* Semantic: error (muted red, AA on tint) */
        --error: #c8362f;
        --error-strong: #b42f28;
        --error-bg: #fcebe9;

        /* Stars */
        --star-active: #fbbf24;
        --star-inactive: #e2e4e9;

        /* Scrollbar */
        --scrollbar: #d2d5dd;

        /* Focus ring (a11y) */
        --ring: 0 0 0 3px rgba(79, 87, 196, 0.28);

        /* Shadows: cool-tinted, soft (no pure black) */
        --shadow-sm: 0 1px 2px rgba(28, 28, 46, 0.05);
        --shadow-md: 0 2px 8px rgba(28, 28, 46, 0.04);
        --shadow-tab: 0 1px 2px rgba(28, 28, 46, 0.06), 0 0 0 1px rgba(28, 28, 46, 0.04);
        --shadow-knob: 0 1px 3px rgba(28, 28, 46, 0.16);
        --shadow-pop: 0 6px 20px rgba(28, 28, 46, 0.1); /* dropdowns, tooltips */

        /* Gradient: subtle cool, lighter than the old gray band */
        --hero-gradient: linear-gradient(135deg, #f3f5f8 0%, #eef1f6 55%, #f5f7f9 100%);

        /* Shopify wordmark (logo text) + disabled-mask overlay */
        --logo-wordmark: #1a1919;
        --overlay-mask: rgba(255, 255, 255, 0.5);
      }

      /* Dark palette in classic Twitter "Dim" style (#15202b navy canvas,
         #38444d dividers, #1da1f2 blue accent + primary buttons, #8899a6 muted
         text, #ffad1f gold stars). Role-consistent: raised recedes < canvas <
         cards lift; insets recede. Duplicated across the two selectors so first
         paint (media query) and explicit override (attribute) match; keep in sync. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #1e2a38;
          --bg-canvas: #15202b;
          --bg-raised: #101a24;
          --bg-inset: #172431;
          --bg-hover: #22303c;
          --border: #38444d;
          --border-subtle: #2c3640;
          --border-muted: #253341;
          --border-hover: #4a5866;
          --border-strong: #425364;
          --text: #ffffff;
          --text-secondary: #e1e8ed;
          --text-muted: #8899a6;
          --text-faint: #6e7c89;
          --text-disabled: #56646f;
          --text-placeholder: #8899a6;
          --text-link: #8899a6;
          --text-link-hover: #ffffff;
          --text-link-muted: #8899a6;
          --text-link-muted-hover: #e1e8ed;
          --text-label: #8899a6;
          --accent: #1da1f2;
          --accent-strong: #1a91da;
          --accent-tint: #182d3d;
          --btn-bg: #1da1f2;
          --btn-bg-hover: #1a91da;
          --btn-text: #ffffff;
          --success: #17bf63;
          --success-strong: #2fd27e;
          --success-bg: #13291f;
          --warning: #ffad1f;
          --warning-bg: #2a2412;
          --error: #e0245e;
          --error-strong: #f0356e;
          --error-bg: #291826;
          --star-active: #ffad1f;
          --star-inactive: #38444d;
          --scrollbar: #38444d;
          --ring: 0 0 0 3px rgba(29, 161, 242, 0.4);
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
          --shadow-tab: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(136, 153, 166, 0.06);
          --shadow-knob: 0 1px 3px rgba(0, 0, 0, 0.6);
          --shadow-pop: 0 0 15px rgba(136, 153, 166, 0.2), 0 0 3px 1px rgba(136, 153, 166, 0.15);
          --hero-gradient: linear-gradient(135deg, #192734 0%, #15202b 55%, #1b2836 100%);
          --logo-wordmark: #ffffff;
          --overlay-mask: rgba(21, 32, 43, 0.5);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1e2a38;
        --bg-canvas: #15202b;
        --bg-raised: #101a24;
        --bg-inset: #172431;
        --bg-hover: #22303c;
        --border: #38444d;
        --border-subtle: #2c3640;
        --border-muted: #253341;
        --border-hover: #4a5866;
        --border-strong: #425364;
        --text: #ffffff;
        --text-secondary: #e1e8ed;
        --text-muted: #8899a6;
        --text-faint: #6e7c89;
        --text-disabled: #56646f;
        --text-placeholder: #8899a6;
        --text-link: #8899a6;
        --text-link-hover: #ffffff;
        --text-link-muted: #8899a6;
        --text-link-muted-hover: #e1e8ed;
        --text-label: #8899a6;
        --accent: #1da1f2;
        --accent-strong: #1a91da;
        --accent-tint: #182d3d;
        --btn-bg: #1da1f2;
        --btn-bg-hover: #1a91da;
        --btn-text: #ffffff;
        --success: #17bf63;
        --success-strong: #2fd27e;
        --success-bg: #13291f;
        --warning: #ffad1f;
        --warning-bg: #2a2412;
        --error: #e0245e;
        --error-strong: #f0356e;
        --error-bg: #291826;
        --star-active: #ffad1f;
        --star-inactive: #38444d;
        --scrollbar: #38444d;
        --ring: 0 0 0 3px rgba(29, 161, 242, 0.4);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-tab: 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(136, 153, 166, 0.06);
        --shadow-knob: 0 1px 3px rgba(0, 0, 0, 0.6);
        --shadow-pop: 0 0 15px rgba(136, 153, 166, 0.2), 0 0 3px 1px rgba(136, 153, 166, 0.15);
        --hero-gradient: linear-gradient(135deg, #192734 0%, #15202b 55%, #1b2836 100%);
        --logo-wordmark: #ffffff;
        --overlay-mask: rgba(21, 32, 43, 0.5);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Accessibility: visible keyboard focus on interactive elements */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Accessibility: honor reduced-motion (collapse entrance + loop animation) */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          animation-delay: 0ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
