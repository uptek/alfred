<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfred for Shopify - Popup</title>
    <meta name="manifest.type" content="browser_action" />
    <style>
      :root {
        color-scheme: light;
        /* Backgrounds: sidebar recedes < canvas < cards lift; insets recede */
        --bg: #fff; /* cards, active tab, inputs, dropdowns (the lift surface) */
        --bg-canvas: #fbfcfd; /* popup + content base: soft off-white, eases glare */
        --bg-raised: #f4f6f8; /* sidebar / footers / code (recede) */
        --bg-inset: #eef1f5; /* wells: chips, tracks, h5/h6 badges */
        --bg-hover: #e9edf3;

        /* Borders */
        --border: #e9eaef;
        --border-subtle: #eef0f3;
        --border-muted: #f2f3f6;
        --border-hover: #ccd0d8;
        --border-strong: #dadde3;

        /* Text: distinct, ordered tiers, all AA on white (faint = decorative tier) */
        --text: #1d1d22;
        --text-secondary: #4d515b;
        --text-muted: #656b78;
        --text-faint: #828892;
        --text-disabled: #b3b8c0;
        --text-placeholder: #8b909b;

        /* Interactive (sidebar tabs = muted gray) */
        --text-link: #656b78;
        --text-link-hover: #3a3e47;
        --text-link-muted: #656b78;
        --text-link-muted-hover: #4d515b;
        --text-label: #656b78;

        /* Accent: calm desaturated indigo = the interactive role
           (green is reserved for the brand logo + success semantics) */
        --accent: #4f57c4;
        --accent-strong: #3f47b3;
        --accent-tint: #eef0fb;

        /* Buttons */
        --btn-bg: #1d1d22;
        --btn-bg-hover: #34343c;
        --btn-text: #fff;

        /* Semantic: success (muted green, AA on tint) */
        --success: #1a9d51;
        --success-strong: #15783f;
        --success-bg: #e7f5ec;

        /* Semantic: warning (amber, AA on tint) */
        --warning: #9a5a08;
        --warning-bg: #f9f0db;

        /* Semantic: error (muted red, AA on tint) */
        --error: #c8362f;
        --error-strong: #b42f28;
        --error-bg: #fcebe9;

        /* Stars */
        --star-active: #fbbf24;
        --star-inactive: #e2e4e9;

        /* Scrollbar */
        --scrollbar: #d2d5dd;

        /* Focus ring (a11y) */
        --ring: 0 0 0 3px rgba(79, 87, 196, 0.28);

        /* Shadows: cool-tinted, soft (no pure black) */
        --shadow-sm: 0 1px 2px rgba(28, 28, 46, 0.05);
        --shadow-md: 0 2px 8px rgba(28, 28, 46, 0.04);
        --shadow-tab: 0 1px 2px rgba(28, 28, 46, 0.06), 0 0 0 1px rgba(28, 28, 46, 0.04);
        --shadow-knob: 0 1px 3px rgba(28, 28, 46, 0.16);
        --shadow-pop: 0 6px 20px rgba(28, 28, 46, 0.1); /* dropdowns, tooltips */

        /* Gradient: subtle cool, lighter than the old gray band */
        --hero-gradient: linear-gradient(135deg, #f3f5f8 0%, #eef1f6 55%, #f5f7f9 100%);

        /* Shopify wordmark (logo text) + disabled-mask overlay */
        --logo-wordmark: #1a1919;
        --overlay-mask: rgba(255, 255, 255, 0.5);
      }

      /* Dark palette: GitHub "Soft dark" (dark dimmed), from Primer primitives
         (#212830 canvas, #3d444d borders, #478be6 accent, #347d39 green primary
         buttons, #d1d7e0/#9198a1 text tiers). Role-consistent: raised recedes <
         canvas < cards lift; insets recede. Duplicated across the two selectors
         so first paint (media query) and explicit override (attribute) match;
         keep in sync (mirrored in designs/popup-preview.html). */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #2a313c;
          --bg-canvas: #212830;
          --bg-raised: #1c222b;
          --bg-inset: #262c36;
          --bg-hover: #2f3742;
          --border: #3d444d;
          --border-subtle: #363d46;
          --border-muted: #2f363f;
          --border-hover: #4b535e;
          --border-strong: #444c56;
          --text: #d1d7e0;
          --text-secondary: #b7bdc8;
          --text-muted: #9198a1;
          --text-faint: #7a828e;
          --text-disabled: #656c76;
          --text-placeholder: #9198a1;
          --text-link: #9198a1;
          --text-link-hover: #d1d7e0;
          --text-link-muted: #9198a1;
          --text-link-muted-hover: #b7bdc8;
          --text-label: #9198a1;
          --accent: #478be6;
          --accent-strong: #316dca;
          --accent-tint: #253141;
          --btn-bg: #347d39;
          --btn-bg-hover: #3b8640;
          --btn-text: #ffffff;
          --success: #57ab5a;
          --success-strong: #6bc46d;
          --success-bg: #23342a;
          --warning: #c69026;
          --warning-bg: #36352c;
          --error: #e5534b;
          --error-strong: #f47067;
          --error-bg: #352327;
          --star-active: #daaa3f;
          --star-inactive: #3d444d;
          --scrollbar: #3d444d;
          --ring: 0 0 0 3px rgba(71, 139, 230, 0.4);
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
          --shadow-tab: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow-knob: 0 1px 3px rgba(0, 0, 0, 0.6);
          --shadow-pop: 0 8px 24px rgba(1, 4, 9, 0.5);
          --hero-gradient: linear-gradient(135deg, #252b34 0%, #212830 55%, #29303a 100%);
          --logo-wordmark: #d1d7e0;
          --overlay-mask: rgba(33, 40, 48, 0.5);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #2a313c;
        --bg-canvas: #212830;
        --bg-raised: #1c222b;
        --bg-inset: #262c36;
        --bg-hover: #2f3742;
        --border: #3d444d;
        --border-subtle: #363d46;
        --border-muted: #2f363f;
        --border-hover: #4b535e;
        --border-strong: #444c56;
        --text: #d1d7e0;
        --text-secondary: #b7bdc8;
        --text-muted: #9198a1;
        --text-faint: #7a828e;
        --text-disabled: #656c76;
        --text-placeholder: #9198a1;
        --text-link: #9198a1;
        --text-link-hover: #d1d7e0;
        --text-link-muted: #9198a1;
        --text-link-muted-hover: #b7bdc8;
        --text-label: #9198a1;
        --accent: #478be6;
        --accent-strong: #316dca;
        --accent-tint: #253141;
        --btn-bg: #347d39;
        --btn-bg-hover: #3b8640;
        --btn-text: #ffffff;
        --success: #57ab5a;
        --success-strong: #6bc46d;
        --success-bg: #23342a;
        --warning: #c69026;
        --warning-bg: #36352c;
        --error: #e5534b;
        --error-strong: #f47067;
        --error-bg: #352327;
        --star-active: #daaa3f;
        --star-inactive: #3d444d;
        --scrollbar: #3d444d;
        --ring: 0 0 0 3px rgba(71, 139, 230, 0.4);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-tab: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-knob: 0 1px 3px rgba(0, 0, 0, 0.6);
        --shadow-pop: 0 8px 24px rgba(1, 4, 9, 0.5);
        --hero-gradient: linear-gradient(135deg, #252b34 0%, #212830 55%, #29303a 100%);
        --logo-wordmark: #d1d7e0;
        --overlay-mask: rgba(33, 40, 48, 0.5);
      }

      /* Dark: toggled filter/toolbar buttons read as accent-selected (GitHub
         toggled-filter style) — legible on/off state without spending green,
         which stays reserved for the single primary action per view. Global on
         purpose — these classes live in scoped Svelte styles across tabs. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) :is(.toolbar-btn--active, .filter--active, .wrap-btn--active) {
          background: var(--accent-tint);
          color: var(--accent);
          border-color: color-mix(in srgb, var(--accent) 40%, transparent);
        }
        :root:not([data-theme='light']) :is(.toolbar-btn--active, .filter--active, .wrap-btn--active):hover {
          background: color-mix(in srgb, var(--accent) 12%, var(--accent-tint));
          color: var(--accent);
          border-color: color-mix(in srgb, var(--accent) 55%, transparent);
        }
      }
      :root[data-theme='dark'] :is(.toolbar-btn--active, .filter--active, .wrap-btn--active) {
        background: var(--accent-tint);
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      }
      :root[data-theme='dark'] :is(.toolbar-btn--active, .filter--active, .wrap-btn--active):hover {
        background: color-mix(in srgb, var(--accent) 12%, var(--accent-tint));
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      }

      /* Dark: pills carry a subtle ring in their own hue (GitHub label style).
         Inset shadow, not border, so pill size is unchanged. Global on purpose —
         pill classes live in scoped Svelte styles across tabs. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light'])
          :is(.pill--green, .pill-green, .flag--green, .status-pill--ok, .tab__badge--green, .stats__update) {
          box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--success) 35%, transparent);
        }
        :root:not([data-theme='light'])
          :is(
            .pill--red,
            .flag--red,
            .status-pill--client-error,
            .status-pill--server-error,
            .pill-red,
            .badge--red,
            .tab__badge--red
          ) {
          box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--error) 35%, transparent);
        }
        :root:not([data-theme='light'])
          :is(.pill--amber, .pill-yellow, .flag--amber, .status-pill--redirect, .dup-badge) {
          box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warning) 35%, transparent);
        }
        :root:not([data-theme='light']) :is(.pill--purple, .tree__badge) {
          box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
        }
        :root:not([data-theme='light']) :is(.pill--neutral, .pill-gray) {
          box-shadow: inset 0 0 0 1px var(--border-strong);
        }
      }
      :root[data-theme='dark']
        :is(.pill--green, .pill-green, .flag--green, .status-pill--ok, .tab__badge--green, .stats__update) {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--success) 35%, transparent);
      }
      :root[data-theme='dark']
        :is(
          .pill--red,
          .flag--red,
          .status-pill--client-error,
          .status-pill--server-error,
          .pill-red,
          .badge--red,
          .tab__badge--red
        ) {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--error) 35%, transparent);
      }
      :root[data-theme='dark'] :is(.pill--amber, .pill-yellow, .flag--amber, .status-pill--redirect, .dup-badge) {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warning) 35%, transparent);
      }
      :root[data-theme='dark'] :is(.pill--purple, .tree__badge) {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
      }
      :root[data-theme='dark'] :is(.pill--neutral, .pill-gray) {
        box-shadow: inset 0 0 0 1px var(--border-strong);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Accessibility: visible keyboard focus on interactive elements */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Accessibility: honor reduced-motion (collapse entrance + loop animation) */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          animation-delay: 0ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
