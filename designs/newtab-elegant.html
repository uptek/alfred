<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <style>
      /* Tokens: popup palette (light + GitHub soft dark), plus serif and cover tones. */
      :root {
        color-scheme: light;
        --bg: #fbfbfc;
        --surface: #fff;
        --hover: #f1f2f5;
        --line: #e8e9ee;
        --line-strong: #d4d7de;
        --text: #1d1d22;
        --text-2: #4d515b;
        --muted: #686d7a;
        --faint: #9298a3;
        --accent: #4f57c4;
        --accent-tint: #e8eafb;
        --attn: #c8362f;
        --warn: #b8730c;
        --paper: #f3f1ec;
        --paper-ink: #3b362e;
        --cool: #eef1f5;
        --cool-ink: #323946;
        --l1: 97.5%;
        --l2: 94.5%;
        --cc: 0.012;
        --hi-l: 100%;
        --ink-l: 38%;
        --ink-c: 0.05;
        --v-l: 52%;
        --shadow-pop: 0 0 0 1px rgba(20, 20, 30, 0.06), 0 18px 48px rgba(20, 20, 30, 0.16);
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --serif: 'Iowan Old Style', Charter, Georgia, serif;
        --mono: 'SF Mono', ui-monospace, Menlo, monospace;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #212830;
          --surface: #2a313c;
          --hover: #2a313b;
          --line: #353c46;
          --line-strong: #4b535e;
          --text: #dfe3ea;
          --text-2: #b7bdc8;
          --muted: #9198a1;
          --faint: #6e7681;
          --accent: #6c9ff0;
          --accent-tint: #253141;
          --attn: #f47067;
          --warn: #d29b3a;
          --paper: #2b2925;
          --paper-ink: #ded7ca;
          --cool: #262c35;
          --cool-ink: #cfd6e0;
          --l1: 31%;
          --l2: 26%;
          --hi-l: 40%;
          --ink-l: 88%;
          --ink-c: 0.06;
          --v-l: 72%;
          --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 18px 48px rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #212830;
        --surface: #2a313c;
        --hover: #2a313b;
        --line: #353c46;
        --line-strong: #4b535e;
        --text: #dfe3ea;
        --text-2: #b7bdc8;
        --muted: #9198a1;
        --faint: #6e7681;
        --accent: #6c9ff0;
        --accent-tint: #253141;
        --attn: #f47067;
        --warn: #d29b3a;
        --paper: #2b2925;
        --paper-ink: #ded7ca;
        --cool: #262c35;
        --cool-ink: #cfd6e0;
        --l1: 31%;
        --l2: 26%;
        --hi-l: 40%;
        --ink-l: 88%;
        --ink-c: 0.06;
        --v-l: 72%;
        --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 18px 48px rgba(0, 0, 0, 0.5);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      h1,
      h2,
      h3,
      h4,
      p,
      ul {
        margin: 0;
        padding: 0;
        font-weight: inherit;
      }
      ul {
        list-style: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 6px;
      }
      ::selection {
        background: var(--accent-tint);
      }
      kbd {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 5px;
        background: var(--hover);
        box-shadow: inset 0 0 0 1px var(--line);
        color: var(--muted);
        font: 500 11px/1 var(--sans);
      }
      code {
        font-family: var(--mono);
        font-size: 0.84em;
        letter-spacing: -0.01em;
      }
      h1,
      h2,
      h3,
      h4,
      .q-t,
      .pal-row b {
        overflow-wrap: anywhere;
      }
      .icon {
        flex: none;
        display: block;
      }
      .attn {
        color: var(--attn);
      }
      .hl {
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.16em;
        text-decoration-color: transparent;
        transition: text-decoration-color 150ms ease-out;
      }
      .hl:hover {
        text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
      }
      .pill {
        height: 36px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 13.5px;
        color: var(--text-2);
        box-shadow: inset 0 0 0 1px var(--line);
        transition:
          background-color 150ms ease-out,
          transform 120ms var(--ease-out);
      }
      .pill:hover {
        background: var(--hover);
      }
      .pill:active {
        transform: scale(0.97);
      }

      /* Quiet */
      .q {
        padding: 0 24px 140px;
      }
      .q-top {
        display: flex;
        justify-content: flex-end;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 0;
      }
      .q-k {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 7px 0 12px;
        border-radius: 9px;
        color: var(--muted);
        font-size: 13px;
        transition:
          background-color 150ms ease-out,
          color 150ms ease-out,
          transform 120ms var(--ease-out);
      }
      .q-k:hover {
        background: var(--hover);
        color: var(--text);
      }
      .q-k:active {
        transform: scale(0.97);
      }
      .q-main {
        max-width: 640px;
        margin: 0 auto;
        padding-top: 7vh;
      }
      .q-date {
        font-size: 13px;
        color: var(--muted);
      }
      .q-hello {
        margin-top: 8px;
        font-size: 36px;
        line-height: 1.1;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .q-sum {
        margin-top: 12px;
        font-size: 16px;
        color: var(--text-2);
        text-wrap: pretty;
      }
      .q-sum b {
        font-weight: 500;
        color: var(--text);
      }
      .q-tabs {
        position: relative;
        display: flex;
        gap: 24px;
        margin-top: 56px;
        box-shadow: inset 0 -1px var(--line);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .q-tab {
        flex: none;
        padding: 0 0 14px;
        font-size: 14px;
        color: var(--muted);
        transition: color 150ms ease-out;
      }
      .q-tab:hover,
      .q-tab[aria-selected='true'] {
        color: var(--text);
      }
      .q-tab:focus-visible {
        outline-offset: -2px;
      }
      .q-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 1.5px;
        border-radius: 1px;
        background: var(--text);
      }
      .q-tabs[data-ready] .q-bar {
        transition:
          transform 240ms var(--ease-out),
          width 240ms var(--ease-out);
      }
      .q-group {
        margin-top: 36px;
      }
      .q-h {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .q-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--attn);
      }
      .q-row {
        display: block;
        margin: 0 -14px;
        padding: 11px 14px;
        border-radius: 10px;
        transition: background-color 150ms ease-out;
      }
      .q-row:hover {
        background: var(--hover);
      }
      .q-t {
        font-size: 15px;
        line-height: 1.45;
        font-weight: 500;
        text-wrap: pretty;
      }
      .q-m {
        margin-top: 3px;
        font-size: 13px;
        color: var(--muted);
      }
      .q-toggle {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
        transition: color 150ms ease-out;
      }
      .q-toggle:hover {
        color: var(--text);
      }
      .q-more {
        display: block;
        margin: 28px auto 0;
      }

      .pal-scrim {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(16, 18, 24, 0.24);
        animation: fade 160ms ease-out;
      }
      .pal {
        position: fixed;
        z-index: 41;
        top: 14vh;
        left: 0;
        right: 0;
        width: min(600px, calc(100vw - 32px));
        margin: 0 auto;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow-pop);
        overflow: hidden;
        transform-origin: 50% 0;
        animation: pop 180ms var(--ease-out);
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }
      .pal-in {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 14px 0 18px;
        color: var(--muted);
        box-shadow: inset 0 -1px var(--line);
      }
      .pal-in input {
        flex: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        outline: 0;
        background: none;
        font-size: 16px;
        color: var(--text);
      }
      .pal-in input::placeholder,
      .g-search input::placeholder {
        color: var(--faint);
      }
      .pal-list {
        max-height: min(380px, 52vh);
        overflow-y: auto;
        padding: 6px;
        scroll-padding: 6px;
      }
      .pal-g {
        padding: 10px 12px 6px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted);
      }
      .pal-row {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 42px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 14px;
      }
      .pal-row[aria-selected='true'] {
        background: var(--hover);
      }
      .pal-row .icon {
        color: var(--muted);
      }
      .pal-row b {
        flex: 1;
        min-width: 0;
        font-weight: 450;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pal-row small {
        flex: none;
        max-width: 45%;
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pal-row small.warn {
        color: var(--warn);
      }
      .pal-empty {
        padding: 28px 12px;
        text-align: center;
        font-size: 13.5px;
        color: var(--muted);
      }
      .pal-foot {
        display: flex;
        gap: 16px;
        padding: 10px 16px;
        font-size: 12px;
        color: var(--muted);
        box-shadow: inset 0 1px var(--line);
      }
      .pal-foot span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .pal-foot kbd {
        height: 18px;
        min-width: 18px;
        font-size: 10.5px;
      }

      /* Editorial */
      .e {
        max-width: 1160px;
        margin: 0 auto;
        padding: 36px 40px 140px;
      }
      .e-mast {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 32px;
      }
      .e-date {
        font: 400 32px/1.15 var(--serif);
        letter-spacing: -0.01em;
      }
      .e-pins {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 22px;
        font-size: 13px;
        color: var(--muted);
      }
      .e-pins a {
        transition: color 150ms ease-out;
      }
      .e-pins a:hover {
        color: var(--text);
      }
      .e-nav {
        display: flex;
        gap: 28px;
        margin-top: 22px;
        border-top: 1px solid var(--text);
        box-shadow: inset 0 -1px var(--line);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .e-nav button {
        flex: none;
        padding: 13px 0 12px;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
        box-shadow: inset 0 -2px transparent;
        transition:
          color 150ms ease-out,
          box-shadow 150ms ease-out;
      }
      .e-nav button:hover,
      .e-nav button[aria-current] {
        color: var(--text);
      }
      .e-nav button[aria-current] {
        box-shadow: inset 0 -2px var(--text);
      }
      .e-nav button:focus-visible {
        outline-offset: -2px;
      }
      .e-kick {
        font: 600 11px/1.4 var(--sans);
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .e-ex {
        margin-top: 16px;
        max-width: 62ch;
        font: 400 19px/1.55 var(--serif);
        color: var(--text-2);
        text-wrap: pretty;
      }
      .e-meta {
        margin-top: 12px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .e-front {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 48px;
        padding-top: 36px;
      }
      .e-lead h2 {
        margin-top: 14px;
        font: 400 46px/1.06 var(--serif);
        letter-spacing: -0.018em;
        text-wrap: balance;
      }
      .e-seconds {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 36px;
        border-top: 1px solid var(--line);
      }
      .e-second {
        padding: 24px 28px 0 0;
      }
      .e-second + .e-second {
        padding: 24px 0 0 28px;
        border-left: 1px solid var(--line);
      }
      .e-second h3 {
        margin-top: 10px;
        font: 400 24px/1.18 var(--serif);
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .e-second .e-ex,
      .e-item .e-ex {
        margin-top: 10px;
        font-size: 16px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .e-rail {
        display: flex;
        flex-direction: column;
        gap: 40px;
        padding-left: 32px;
        border-left: 1px solid var(--line);
      }
      .e-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--text);
        font: 600 11px/1 var(--sans);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .e-label span {
        font-weight: 500;
        color: var(--muted);
      }
      .e-label button {
        letter-spacing: inherit;
        text-transform: inherit;
      }
      .e-list li {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .e-list h4 {
        font: 400 17.5px/1.3 var(--serif);
        text-wrap: pretty;
      }
      .e-list .e-meta {
        margin-top: 6px;
      }
      .e-stores {
        margin-top: 56px;
      }
      .e-stores ul {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .e-stores li {
        padding: 16px 24px 0;
      }
      .e-stores li:first-child {
        padding-left: 0;
      }
      .e-stores li + li {
        border-left: 1px solid var(--line);
      }
      .e-store {
        display: block;
      }
      .e-store b {
        font-size: 14px;
        font-weight: 500;
      }
      .e-store small {
        display: block;
        margin-top: 2px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .e-store em {
        display: block;
        margin-top: 6px;
        font-style: normal;
        font-size: 12px;
        color: var(--warn);
      }
      .e-depts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-top: 56px;
        border-top: 1px solid var(--text);
      }
      .e-dept {
        padding: 18px 24px 0;
      }
      .e-dept:first-child {
        padding-left: 0;
      }
      .e-dept:last-child {
        padding-right: 0;
      }
      .e-dept + .e-dept {
        border-left: 1px solid var(--line);
      }
      .e-dept .e-label {
        padding-bottom: 6px;
        border: 0;
      }
      .e-dept li {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .e-dept h4 {
        font: 400 17px/1.3 var(--serif);
        text-wrap: pretty;
      }
      .e-dept .e-meta {
        margin-top: 6px;
      }
      .e-all {
        margin-top: 14px;
        font-size: 12.5px;
        color: var(--muted);
        transition: color 150ms ease-out;
      }
      .e-all:hover {
        color: var(--text);
      }
      .e-sec {
        max-width: 760px;
        margin: 0 auto;
        padding-top: 48px;
      }
      .e-sec-h {
        padding-bottom: 20px;
        border-bottom: 1px solid var(--text);
      }
      .e-sec-h h2 {
        font: 400 40px/1.1 var(--serif);
        letter-spacing: -0.015em;
      }
      .e-sec-h p {
        margin-top: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .e-item {
        padding: 28px 0;
        border-bottom: 1px solid var(--line);
      }
      .e-item h3 {
        margin-top: 10px;
        font: 400 26px/1.18 var(--serif);
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .e-item .e-ex {
        -webkit-line-clamp: 2;
      }
      .e-more {
        display: block;
        margin: 32px auto 0;
      }
      @media (max-width: 960px) {
        .e-front {
          grid-template-columns: 1fr;
        }
        .e-rail {
          padding: 0;
          border-left: 0;
        }
        .e-depts,
        .e-stores ul {
          grid-template-columns: 1fr 1fr;
          row-gap: 40px;
        }
        .e-stores li:nth-child(odd) {
          padding-left: 0;
          border-left: 0;
        }
        .e-dept:nth-child(odd) {
          padding-left: 0;
          border-left: 0;
        }
        .e-dept:nth-child(even) {
          padding-right: 0;
        }
      }
      @media (max-width: 640px) {
        .e {
          padding: 24px 20px 140px;
        }
        .e-date {
          font-size: 26px;
        }
        .e-lead h2 {
          font-size: 32px;
        }
        .e-ex {
          font-size: 17px;
        }
        .e-seconds,
        .e-rail,
        .e-depts,
        .e-stores ul {
          grid-template-columns: 1fr;
          row-gap: 0;
        }
        .e-stores li,
        .e-stores li + li {
          padding: 14px 0;
          border-left: 0;
          border-bottom: 1px solid var(--line);
        }
        .e-second,
        .e-second + .e-second {
          padding: 24px 0 0;
          border-left: 0;
        }
        .e-second + .e-second {
          margin-top: 24px;
          border-top: 1px solid var(--line);
        }
        .e-dept,
        .e-dept + .e-dept {
          padding: 18px 0 0;
          border-left: 0;
        }
      }

      /* Gallery */
      .g {
        max-width: 1240px;
        margin: 0 auto;
        padding: 56px 40px 140px;
      }
      .g-search {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(560px, 100%);
        height: 50px;
        margin: 0 auto;
        padding: 0 12px 0 18px;
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        box-shadow:
          0 0 0 1px var(--line),
          0 1px 2px rgba(20, 20, 30, 0.04);
        cursor: text;
        transition: box-shadow 200ms ease-out;
      }
      .g-search:focus-within {
        box-shadow:
          0 0 0 1px var(--line-strong),
          0 8px 24px rgba(20, 20, 30, 0.08);
      }
      .g-search input {
        flex: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        outline: 0;
        background: none;
        font-size: 15px;
        color: var(--text);
        appearance: none;
      }
      .g-search input::-webkit-search-cancel-button {
        display: none;
      }
      .g-dock {
        display: flex;
        justify-content: safe center;
        gap: 2px;
        margin-top: 24px;
        padding: 4px 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .g-tile {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 84px;
        padding: 10px 4px 8px;
        border-radius: 14px;
        transition: background-color 150ms ease-out;
      }

":"1y ago","categories":[],"excerpt":"","thumb":null},{"source":"yt-eng","stream":"videos","title":"Building at Scale: Fireside Chat (Toronto Tech Week)","link":"https://www.youtube.com/watch?v=F7Pjt806oEw","date":"2025-09-30T15:56:51.006Z","ago":"1y ago","categories":[],"excerpt":"","thumb":null},{"source":"yt-eng","stream":"videos","title":"Developer Productivity: Fireside with Daniel Doubrovkine and Michael Bachman (Toronto Tech Week)","link":"https://www.youtube.com/watch?v=WMjt0U7b1gI","date":"2025-09-30T14:56:51.006Z","ago":"1y ago","categories":[],"excerpt":"","thumb":null},{"source":"yt-eng","stream":"videos","title":"Leveraging Multimodal LLMs for Shopify’s Global Catalogue","link":"https://www.youtube.com/watch?v=sGrkxnOe7Zs","date":"2025-09-30T13:56:51.006Z","ago":"1y ago","categories":[],"excerpt":"","thumb":null},{"source":"yt-eng","stream":"videos","title":"Circlez Coffee Demo","link":"https://www.youtube.com/watch?v=eMJBsCMmq0A","date":"2023-10-01T12:56:51.006Z","ago":"3y ago","categories":[],"excerpt":"","thumb":null},{"source":"yt-eng","stream":"videos","title":"Our Relationship with Rails | Shopify Engineering","link":"https://www.youtube.com/watch?v=FUy64bt54N4","date":"2022-10-01T11:56:51.006Z","ago":"4y ago","categories":[],"excerpt":"","thumb":null}]}</script>
    <script>
      const SNAP = JSON.parse(document.getElementById('snapshot').textContent);
      const NOW = Date.now();
      const DAY = 864e5;
      const root = document.documentElement;
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => [...document.querySelectorAll(s)];

      const themeParam = new URLSearchParams(location.search).get('theme');
      if (themeParam === 'dark' || themeParam === 'light') root.dataset.theme = themeParam;

      const SOURCES = {
        changelog: { label: 'Changelog', site: 'shopify.dev' },
        news: { label: 'Newsroom', site: 'shopify.com/news' },
        eng: { label: 'Engineering', site: 'shopify.engineering' },
        'yt-shopify': { label: 'Shopify', site: 'YouTube', h: 150 },
        'yt-devs': { label: 'ShopifyDevs', site: 'YouTube', h: 265 },
        'yt-eng': { label: 'Shopify Engineering', site: 'YouTube', h: 205 }
      };
      const STREAMS = [
        ['all', 'All'],
        ['platform', 'Platform'],
        ['videos', 'Videos'],
        ['engineering', 'Engineering'],
        ['news', 'News']
      ];
      const ACTION = {
        'Action Required': 'Action required',
        'Breaking API Change': 'Breaking change',
        'Deprecation announcement': 'Deprecation'
      };
      const NOT_AREA = new Set(['API', 'Platform', 'New', 'Update', ...Object.keys(ACTION)]);
      const isVersion = (c) => /^\d{4}-\d{2}$/.test(c);
      const AREA_HUE = {
        'Admin GraphQL API': 255,
        'Admin REST API': 240,
        'Storefront API': 185,
        Functions: 28,
        Themes: 330,
        Liquid: 320,
        'Checkout UI': 210,
        'POS Extensions': 165,
        'Payments Apps API': 125,
        'Customer Account API': 140,
        'Customer Accounts': 140,
        'Events & webhooks': 42,
        'App Events API': 42,
        'App store': 220,
        'Built for Shopify': 150,
        'Admin Extensions': 262,
        Tools: 200,
        'Shopify CLI': 200,
        Hydrogen: 195,
        Polaris: 275,
        'Dev Dashboard': 230,
        'AI Toolkit': 295,
        UCP: 305,
        Catalog: 175,
        'Metafields and metaobjects': 35,
        ShopifyQL: 55
      };
      const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

      const ITEMS = SNAP.items
        .map((i) => ({
          ...i,
          t: Date.parse(i.date),
          action: ACTION[i.categories.find((c) => ACTION[c])] || null,
          area: i.categories.find((c) => !NOT_AREA.has(c) && !isVersion(c)) || null,
          version: i.categories.find(isVersion) || null
        }))
        .sort((a, b) => b.t - a.t);
      const RECENT_ACTION = ITEMS.filter((i) => i.action && NOW - i.t < 30 * DAY);

      // Sample stores: the real feature reads stores Alfred detected, plus /meta.json from the storefront.
      const STORES = [
        { handle: 'northwind-kitchen', name: 'Northwind Kitchen', short: 'Northwind', theme: 'Dawn', version: '15.4.0', latest: '15.4.1', products: 248 },
        { handle: 'trailmark-travel', name: 'Trailmark Travel Co.', short: 'Trailmark', theme: 'Horizon', version: '2.1.0', latest: '2.1.0', products: 1312 },
        { handle: 'bytebench', name: 'Bytebench', short: 'Bytebench', theme: 'Prestige', version: '10.6.0', latest: '10.8.0', products: 3904 },
        { handle: 'lumen-learning', name: 'Lumen Learning', short: 'Lumen', theme: 'Sense', version: '15.2.0', latest: '15.4.1', products: 86 }
      ].map((s) => ({ ...s, url: `https://admin.shopify.com/store/${s.handle}`, update: s.version !== s.latest }));
      const PINS = [
        { name: 'Northwind orders', short: 'Orders', url: 'https://admin.shopify.com/store/northwind-kitchen/orders' },
        { name: 'Theme editor', short: 'Theme editor', url: 'https://admin.shopify.com/store/northwind-kitchen/themes/current/editor' },
        { name: 'Bytebench storefront', short: 'Storefront', url: 'https://bytebench.myshopify.com' },
        { name: 'API versioning', short: 'API versions', url: 'https://shopify.dev/docs/api/usage/versioning' },
        { name: 'Partner payouts', short: 'Payouts', url: 'https://partners.shopify.com/current/payouts' }
      ];
      const pinIcon = (u) => {
        const host = new URL(u).hostname;
        if (host === 'admin.shopify.com') return 'admin';
        if (host.endsWith('.myshopify.com')) return 'store';
        if (host === 'partners.shopify.com') return 'users';
        if (host === 'shopify.dev') return 'code';
        return 'link';
      };
      const hostPath = (u) => {
        const url = new URL(u);
        return (url.hostname + url.pathname).replace(/\/$/, '');
      };

      const ICONS = {
        search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
        store: '<path d="M4 9.5V20h16V9.5"/><path d="M3 9.5 4.5 4h15L21 9.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0"/><path d="M10 20v-5h4v5"/>',
        admin: '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9 3.5v17"/>',
        code: '<path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4"/>',
        users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6.5 6.5 0 0 0-3.5-5.8"/>',
        link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
        doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
        play: '<path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/>'
      };
      const icon = (name, size = 16) =>
        `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

      // Feed content is untrusted: every string is escaped and only https links render.
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const href = (u) => (/^https:\/\//.test(u) ? esc(u) : '#');
      // Prototype links open in a new tab; the real new tab opens them in place.
      const title = (i) => esc(i.title).replace(/`([^`]+)`/g, '<code>$1</code>');
      const ext = (u) => `href="${href(u)}" target="_blank" rel="noopener"`;

      const sameYear = (d) => d.getFullYear() === new Date(NOW).getFullYear();
      const shortDate = (t) => {
        const d = new Date(t);
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', ...(!sameYear(d) && { year: 'numeric' }) });
      };
      function rel(t, long) {
        const d = NOW - t;
        const unit = (n, word, abbr) => (long ? `${n} ${word}${n > 1 ? 's' : ''} ago` : `${n}${abbr} ago`);
        if (d < 36e5) return unit(Math.max(1, Math.round(d / 6e4)), 'minute', 'm');
        if (d < DAY) return unit(Math.round(d / 36e5), 'hour', 'h');
        if (d < 7 * DAY) return unit(Math.round(d / DAY), 'day', 'd');
        return shortDate(t);
      }
      const time = (i, long) => `<time datetime="${esc(i.date)}">${esc(rel(i.t, long))}</time>`;
      function dayLabel(t) {
        const a = new Date(t);
        const b = new Date(NOW);
        a.setHours(0, 0, 0, 0);
        b.setHours(0, 0, 0, 0);
        const n = Math.round((b - a) / DAY);
        if (n <= 0) return 'Today';
        if (n === 1) return 'Yesterday';
        if (n < 7) return a.toLocaleDateString('en-GB', { weekday: 'long' });
        return a.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', ...(!sameYear(a) && { year: 'numeric' }) });
      }
      const today = (year) =>
        new Date(NOW).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', ...(year && { year: 'numeric' }) });
      const inStream = (key) => (i) => key === 'all' || i.stream === key;

      const S = { qTab: 'all', qShown: 24, qAllAction: false, pal: null, eSec: 'front', eShown: 12, gTab: 'all', gQ: '', gShown: 24 };

      /* 1. Quiet: one column, everything else one keystroke away. */
      function quiet() {
        S.pal = null;
        const h = new Date().getHours();
        const hello = h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 17 ? 'Good afternoon' : 'Good evening';
        const n = RECENT_ACTION.length;
        const week = ITEMS.filter((i) => NOW - i.t < 7 * DAY).length;
        const need = n ? `<b>${n} change${n > 1 ? 's' : ''}</b> need${n > 1 ? '' : 's'} your action` : 'Nothing needs your action';
        return `<div class="q">
          <header class="q-top"><button class="q-k" data-act="pal-open">Search <kbd>⌘K</kbd></button></header>
          <main class="q-main">
            <p class="q-date">${esc(today())}</p>
            <h1 class="q-hello">${hello}.</h1>
            <p class="q-sum">${need}, ${week ? `${week} new this week` : 'nothing new this week'}.</p>
            <nav class="q-tabs" role="tablist" aria-label="Sources">
              ${STREAMS.map(([k, l]) => `<button class="q-tab" role="tab" data-act="q-tab" data-k="${k}" aria-selected="${S.qTab === k}">${l}</button>`).join('')}
              <span class="q-bar" aria-hidden="true"></span>
            </nav>
            <div id="q-list">${qList()}</div>
          </main>
        </div>`;
      }
      function qMeta(i, pinned) {
        if (pinned)
          return [i.action !== 'Action required' && `<span class="attn">${esc(i.action)}</span>`, esc(i.area || 'Platform'), esc(i.version), time(i, true)]
            .filter(Boolean)
            .join(' · ');
        const parts =
          i.stream === 'videos'
            ? ['Video', SOURCES[i.source].label]
            : i.source === 'changelog'
              ? ['Changelog', i.area, i.version]
              : [SOURCES[i.source].label];
        return (i.action ? `<span class="attn">${esc(i.action)}</span> · ` : '') + parts.filter(Boolean).map(esc).join(' · ');
      }
      const qRow = (i, pinned) => `<a class="q-row" ${ext(i.link)}><div class="q-t">${title(i)}</div><div class="q-m">${qMeta(i, pinned)}</div></a>`;
      const qGroup = (label, list, pinned, after = '') =>
        `<section class="q-group"><h2 class="q-h">${label}</h2>${list.map((i) => qRow(i, pinned)).join('')}${after}</section>`;
      function qList() {
        const pool = ITEMS.filter(inStream(S.qTab));
        const pinned = pool.filter((i) => RECENT_ACTION.includes(i));
        const rest = pool.filter((i) => !pinned.includes(i));
        const toggle =
          pinned.length > 3 ? `<button class="q-toggle" data-act="q-action">${S.qAllAction ? 'Show fewer' : `Show all ${pinned.length}`}</button>` : '';
        let html = pinned.length ? qGroup('<span class="q-dot"></span>Needs action', S.qAllAction ? pinned : pinned.slice(0, 3), true, toggle) : '';
        let label = null;
        let bucket = [];
        for (const i of rest.slice(0, S.qShown)) {
          const l = dayLabel(i.t);
          if (l !== label && bucket.length) {
            html += qGroup(esc(label), bucket);
            bucket = [];
          }
          label = l;
          bucket.push(i);
        }
        if (bucket.length) html += qGroup(esc(label), bucket);
        if (rest.length > S.qShown) html += `<button class="pill q-more" data-act="q-more">Show more</button>`;
        return html;
      }
      function qBar() {
        const tab = $('.q-tab[aria-selected="true"]');
        const bar = $('.q-bar');
        if (!tab || !bar) return;
        bar.style.width = tab.offsetWidth + 'px';
        bar.style.transform = `translateX(${tab.offsetLeft}px)`;
      }

      function palGroups() {
        const q = (S.pal?.q || '').trim().toLowerCase();
        const has = (...xs) => !q || xs.some((x) => x && x.toLowerCase().includes(q));
        const groups = [
          [
            'Stores',
            STORES.filter((s) => has(s.name, s.handle)).map((s) => ({
              icon: 'store',
              title: s.name,
              meta: s.update ? `${s.theme} ${s.latest} available` : `${s.theme} ${s.version}`,
              warn: s.update,
              url: s.url
            }))
          ],
          ['Pinned', PINS.filter((p) => has(p.name, p.url)).map((p) => ({ icon: pinIcon(p.url), title: p.name, meta: hostPath(p.url), url: p.url }))],
          [
            'Updates',
            q
              ? ITEMS.filter((i) => has(i.title, i.area))
                  .slice(0, 6)
                  .map((i) => ({ icon: i.stream === 'videos' ? 'play' : 'doc', html: title(i), meta: rel(i.t), url: i.link }))
              : []
          ]
        ];
        return groups.filter(([, rows]) => rows.length);
      }
      function palList() {
        const groups = palGroups();
        if (!groups.length) return `<p class="pal-empty">No matches for “${esc(S.pal.q)}”.</p>`;
        let n = 0;
        return groups
          .map(
            ([label, rows]) =>
              `<div class="pal-g">${label}</div>` +
              rows
                .map((r) => {
                  const i = n++;
                  return `<a class="pal-row" role="option" data-i="${i}" aria-selected="${i === S.pal.sel}" ${ext(r.url)}>${icon(r.icon)}<b>${r.html || esc(r.title)}</b><small class="${r.warn ? 'warn' : ''}">${esc(r.meta)}</small></a>`;
                })
                .join('')
          )
          .join('');
      }
      function palMark() {
        $$('.pal-row').forEach((r) => r.setAttribute('aria-selected', +r.dataset.i === S.pal.sel));
        $('.pal-row[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
      }
      function openPal() {
        if (S.pal) return;
        S.pal = { q: '', sel: 0 };
        $('.q').insertAdjacentHTML(
          'beforeend',
          `<div class="pal-scrim" data-act="pal-close"></div>
          <div class="pal" role="dialog" aria-modal="true" aria-label="Search">
            <div class="pal-in">${icon('search', 18)}<input id="pal-q" placeholder="Search stores, links and updates" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="pal-list"><kbd>esc</kbd></div>
            <div class="pal-list" id="pal-list" role="listbox">${palList()}</div>
            <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>↵</kbd> to open</span></div>
          </div>`
        );
        const input = $('#pal-q');
        input.focus();
        input.addEventListener('input', () => {
          S.pal.q = input.value;
          S.pal.sel = 0;
          $('#pal-list').innerHTML = palList();
        });
        input.addEventListener('keydown', (e) => {
          const rows = $$('.pal-row');
          if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && rows.length) {
            e.preventDefault();
            S.pal.sel = (S.pal.sel + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
            palMark();
          } else if (e.key === 'Enter' && rows[S.pal.sel]) {
            window.open(rows[S.pal.sel].href, '_blank', 'noopener');
            closePal();
          }
        });
        $('#pal-list').addEventListener('mousemove', (e) => {
          const r = e.target.closest('.pal-row');
          if (r && +r.dataset.i !== S.pal.sel) {
            S.pal.sel = +r.dataset.i;
            $$('.pal-row').forEach((x) => x.setAttribute('aria-selected', x === r));
          }
        });
      }
      function closePal() {
        if (!S.pal) return;
        S.pal = null;
        $('.pal-scrim')?.remove();
        $('.pal')?.remove();
        $('.q-k')?.focus();
      }

      /* 2. Editorial: a front page set in type, no imagery. */
      const SECTIONS = [
        ['front', 'Front page'],
        ['platform', 'Platform'],
        ['engineering', 'Engineering'],
        ['videos', 'Videos'],
        ['news', 'Newsroom']
      ];
      const SECTION_INFO = {
        platform: ['Every entry in the shopify.dev changelog.', 'updates'],
        engineering: ['Essays from the Shopify Engineering blog.', 'posts'],
        videos: ['New from Shopify, ShopifyDevs and Shopify Engineering on YouTube.', 'videos'],
        news: ['Announcements from the Shopify newsroom.', 'stories']
      };
      function kicker(i) {
        if (i.source === 'changelog')
          return [i.action && `<span class="attn">${esc(i.action)}</span>`, esc(i.area || 'Platform'), esc(i.version)].filter(Boolean).join(' · ');
        if (i.stream === 'videos') return `Video · ${esc(SOURCES[i.source].label)}`;
        return esc(SOURCES[i.source].label);
      }
      const byline = (i) => `${esc(SOURCES[i.source].site)} · ${time(i, true)}`;
      function editorial() {
        return `<div class="e">
          <header class="e-mast">
            <h1 class="e-date">${esc(today(true))}</h1>
            <nav class="e-pins" aria-label="Pinned">${PINS.map((p) => `<a ${ext(p.url)}>${esc(p.name)}</a>`).join('')}</nav>
          </header>
          <nav class="e-nav" aria-label="Sections">${SECTIONS.map(([k, l]) => `<button data-act="e-sec" data-k="${k}" ${S.eSec === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
          ${S.eSec === 'front' ? eFront() : eSection()}
        </div>`;
      }
      function eFront() {
        const used = new Set();
        const take = (i) => (used.add(i), i);
        const lead = take(RECENT_ACTION[0] || ITEMS.find((i) => i.source === 'changelog'));
        const seconds = [
          ITEMS.find((i) => !used.has(i) && i.source === 'changelog' && !i.action && i.excerpt),
          ITEMS.find((i) => i.source === 'eng')
        ]
          .filter(Boolean)
          .map(take);
        const action = ITEMS.filter((i) => i.action && !used.has(i))
          .slice(0, 4)
          .map(take);
        const dept = (key, label, more) => {
          const list = ITEMS.filter((i) => i.stream === key && !used.has(i)).slice(0, 4);
          return `<section class="e-dept">
            <h3 class="e-label"><button class="hl" data-act="e-sec" data-k="${key}">${label}</button></h3>
            <ul>${list.map((i) => `<li><h4><a class="hl" ${ext(i.link)}>${title(i)}</a></h4><p class="e-meta">${i.source === 'changelog' ? kicker(i) : time(i, true)}</p></li>`).join('')}</ul>
            <button class="e-all" data-act="e-sec" data-k="${key}">${more}</button>
          </section>`;
        };
        return `<div class="e-front">
            <div>
              <article class="e-lead">
                <p class="e-kick">${kicker(lead)}</p>
                <h2><a class="hl" ${ext(lead.link)}>${title(lead)}</a></h2>
                ${lead.excerpt ? `<p class="e-ex">${esc(lead.excerpt)}</p>` : ''}
                <p class="e-meta">${byline(lead)}</p>
              </article>
              <div class="e-seconds">${seconds
                .map(
                  (i) => `<article class="e-second">
                    <p class="e-kick">${kicker(i)}</p>
                    <h3><a class="hl" ${ext(i.link)}>${title(i)}</a></h3>
                    ${i.excerpt ? `<p class="e-ex">${esc(i.excerpt)}</p>` : ''}
                    <p class="e-meta">${byline(i)}</p>
                  </article>`
                )
                .join('')}</div>
            </div>
            <aside class="e-rail">
              <section>
                <h3 class="e-label">Also needs action</h3>
                <ul class="e-list">${action.map((i) => `<li><h4><a class="hl" ${ext(i.link)}>${title(i)}</a></h4><p class="e-meta">${esc(i.area || 'Platform')} · ${time(i, true)}</p></li>`).join('')}</ul>
              </section>
            </aside>
          </div>
          <section class="e-stores">
            <h3 class="e-label">Your stores <span>${STORES.length}</span></h3>
            <ul>${STORES.map((s) => `<li><a class="e-store" ${ext(s.url)}><b class="hl">${esc(s.name)}</b><small>${esc(s.theme)} ${esc(s.version)} · ${s.products.toLocaleString('en-US')} products</small>${s.update ? `<em>${esc(s.theme)} ${esc(s.latest)} available</em>` : ''}</a></li>`).join('')}</ul>
          </section>
          <div class="e-depts">${dept('platform', 'Platform', 'More updates')}${dept('engineering', 'Engineering', 'More posts')}${dept('videos', 'Videos', 'More videos')}${dept('news', 'Newsroom', 'More news')}</div>`;
      }
      function eSection() {
        const list = ITEMS.filter((i) => i.stream === S.eSec);
        const title = SECTIONS.find(([k]) => k === S.eSec)[1];
        return `<div class="e-sec">
          <header class="e-sec-h"><h2>${title}</h2><p>${SECTION_INFO[S.eSec][0]} ${list.length} ${SECTION_INFO[S.eSec][1]}.</p></header>
          <div id="e-items">${eItems(list)}</div>
        </div>`;
      }
      function eItems(list = ITEMS.filter((i) => i.stream === S.eSec)) {
        return (
          list
            .slice(0, S.eShown)
            .map(
              (i) => `<article class="e-item">
                <p class="e-kick">${kicker(i)}</p>
                <h3><a class="hl" ${ext(i.link)}>${title(i)}</a></h3>
                ${i.excerpt ? `<p class="e-ex">${esc(i.excerpt)}</p>` : ''}
                <p class="e-meta">${byline(i)}</p>
              </article>`
            )
            .join('') + (list.length > S.eShown ? `<button class="pill e-more" data-act="e-more">More stories</button>` : '')
        );
      }

      /* 3. Gallery: image-led grid with typographic covers. */
      function gallery() {
        const tile = (url, label, tip, face, dot) =>
          `<a class="g-tile" ${ext(url)} title="${esc(tip)}">${face}${dot ? '<i></i>' : ''}</span><span class="g-lbl">${esc(label)}</span></a>`;
        return `<div class="g">
          <label class="g-search">${icon('search', 18)}<input id="g-q" type="search" placeholder="Search updates" value="${esc(S.gQ)}" autocomplete="off" spellcheck="false" aria-label="Search updates"><kbd>⌘K</kbd></label>
          <nav class="g-dock" aria-label="Shortcuts">
            ${STORES.map((s) => tile(s.url, s.short, s.update ? `${s.name}: ${s.theme} ${s.latest} available` : s.name, `<span class="g-ic mono" style="--h:${hash(s.handle) % 360}">${esc(s.name[0])}`, s.update)).join('')}
            <span class="g-sep" aria-hidden="true"></span>
            ${PINS.map((p) => tile(p.url, p.short, p.name, `<span class="g-ic">${icon(pinIcon(p.url), 20)}`)).join('')}
          </nav>
          <div class="g-chips" role="group" aria-label="Sources">${STREAMS.map(([k, l]) => `<button class="g-chip" data-act="g-tab" data-k="${k}" aria-pressed="${S.gTab === k}">${l}</button>`).join('')}</div>
          <div id="g-grid">${gGrid()}</div>
        </div>`;
      }
      function art(i) {
        const h = hash(i.title);
        const pos = `--x:${15 + (h % 70)}%;--y:${10 + ((h >> 8) % 60)}%`;
        if (i.stream === 'videos')
          return `<div class="g-art art-vid" style="--h:${SOURCES[i.source].h};${pos}"><span class="art-play">${icon('play', 20)}</span></div>`;
        if (i.source === 'changelog') {
          const hue = AREA_HUE[i.area] ?? hash(i.area || 'Platform') % 360;
          return `<div class="g-art art-cl" style="--h:${hue};${pos}"><span class="art-v">${esc(i.version || '')}</span><span class="art-a">${esc(i.area || 'Platform')}</span></div>`;
        }
        const quote = (i.excerpt || i.title).split(/(?<=[.!?])\s/)[0];
        return `<div class="g-art art-q ${i.source}"><blockquote>${esc(quote)}</blockquote></div>`;
      }
      const gCard = (i) => `<a class="g-card" ${ext(i.link)}>
          <div class="g-cov" aria-hidden="true">${art(i)}${i.action ? `<span class="g-flag">${esc(i.action)}</span>` : ''}</div>
          <div class="g-meta"><span>${esc(SOURCES[i.source].label)}</span><span>·</span>${time(i)}</div>
          <h3 class="g-title">${title(i)}</h3>
        </a>`;
      function gGrid() {
        const q = S.gQ.trim().toLowerCase();
        const list = ITEMS.filter(inStream(S.gTab)).filter((i) => !q || [i.title, i.excerpt, ...i.categories].join(' ').toLowerCase().includes(q));
        if (!list.length) return `<p class="g-empty">Nothing matches “${esc(S.gQ)}”.</p>`;
        return (
          `<div class="g-grid">${list.slice(0, S.gShown).map(gCard).join('')}</div>` +
          (list.length > S.gShown ? `<div class="g-foot"><button class="pill" data-act="g-more">Load more</button></div>` : '')
        );
      }

      const variants = [quiet, editorial, gallery];

      // `variants` is an array of render functions, one per variant, in picker order.
      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        // Clear first, render next frame, so entrance animations re-run.
        requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      // Enable the slide only after first paint, so load doesn't animate.
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

      // Place the Quiet tab bar once a mount lands, then let it slide.
      new MutationObserver(() => {
        const tabs = $('.q-tabs');
        if (!tabs || tabs.dataset.placed) return;
        tabs.dataset.placed = '1';
        qBar();
        requestAnimationFrame(() => tabs.setAttribute('data-ready', ''));
      }).observe(stage, { childList: true });
      window.addEventListener('resize', qBar);

      stage.addEventListener('click', (e) => {
        if (e.target.closest('.pal-row')) return setTimeout(closePal);
        const el = e.target.closest('[data-act]');
        if (!el) return;
        const k = el.dataset.k;
        switch (el.dataset.act) {
          case 'q-tab':
            S.qTab = k;
            S.qShown = 24;
            $$('.q-tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.k === k));
            qBar();
            $('#q-list').innerHTML = qList();
            break;
          case 'q-action':
            S.qAllAction = !S.qAllAction;
            $('#q-list').innerHTML = qList();
            break;
          case 'q-more':
            S.qShown += 24;
            $('#q-list').innerHTML = qList();
            break;
          case 'pal-open':
            openPal();
            break;
          case 'pal-close':
            closePal();
            break;
          case 'e-sec':
            S.eSec = k;
            S.eShown = 12;
            stage.innerHTML = editorial();
            if (scrollY > 160) scrollTo(0, 0);
            break;
          case 'e-more':
            S.eShown += 12;
            $('#e-items').innerHTML = eItems();
            break;
          case 'g-tab':
            S.gTab = k;
            S.gShown = 24;
            $$('.g-chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.k === k));
            $('#g-grid').innerHTML = gGrid();
            break;
          case 'g-more':
            S.gShown += 24;
            $('#g-grid').innerHTML = gGrid();
            break;
        }
      });
      stage.addEventListener('input', (e) => {
        if (e.target.id !== 'g-q') return;
        S.gQ = e.target.value;
        S.gShown = 24;
        $('#g-grid').innerHTML = gGrid();
      });

      function toggleTheme() {
        const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = dark ? 'light' : 'dark';
        const url = new URL(location);
        url.searchParams.set('theme', root.dataset.theme);
        history.replaceState(null, '', url);
      }
      function focusSearch() {
        if ($('.q')) openPal();
        else $('#g-q')?.focus();
      }
      // ⌘K or / opens search, Escape closes it, T flips the theme.
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (S.pal) return closePal();
          if (e.target.id === 'g-q') {
            e.target.value = '';
            S.gQ = '';
            $('#g-grid').innerHTML = gGrid();
            return e.target.blur();
          }
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          return focusSearch();
        }
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === '/') {
          e.preventDefault();
          focusSearch();
        } else if (e.key === 't' || e.key === 'T') toggleTheme();
      });
    </script>
  </body>
</html>
