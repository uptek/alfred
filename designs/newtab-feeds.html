      const unread = (i) => i.t > S.lastVisit;
      function rel(i) {
        if (i.ago) return i.ago;
        const d = NOW - i.t;
        if (d < 36e5) return `${Math.max(1, Math.round(d / 6e4))}m ago`;
        if (d < DAY) return `${Math.round(d / 36e5)}h ago`;
        if (d < 7 * DAY) return `${Math.round(d / DAY)}d ago`;
        const dt = new Date(i.t);
        const opts = { month: 'short', day: 'numeric' };
        if (dt.getFullYear() !== new Date(NOW).getFullYear()) opts.year = 'numeric';
        return dt.toLocaleDateString('en-US', opts);
      }
      const time = (i) =>
        `<time datetime="${esc(i.date)}" title="${esc(new Date(i.t).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }))}">${esc(rel(i))}</time>`;
      const srcAv = (id, size = 26) =>
        `<span class="srcav" style="--h:${SOURCES[id].h};width:${size}px;height:${size}px;border-radius:${Math.round(size / 3.2)}px">${icon(SOURCES[id].icon, Math.round(size * 0.55))}</span>`;
      const kindOf = (i) => {
        const c = i.categories.find((c) => ACTION.includes(c));
        return c ? TYPE_OF.get(c) : null;
      };

      function tags(i, maxAreas = 2) {
        const out = [];
        i.categories
          .filter((c) => TYPE_OF.has(c) && c !== 'Update')
          .forEach((c) => {
            const t = TYPE_OF.get(c);
            out.push(`<span class="tag tag--${t.tone}">${esc(t.label)}</span>`);
          });
        i.categories
          .filter(isArea)
          .slice(0, maxAreas)
          .forEach((a) => out.push(`<span class="tag">#${esc(slug(a))}</span>`));
        const v = i.categories.find(isVersion);
        if (v) out.push(`<span class="tag tag--ver">${esc(v)}</span>`);
        return out.length ? `<div class="tags">${out.join('')}</div>` : '';
      }

      function art(i) {
        if (i.stream === 'videos') return [SOURCES[i.source].h, 'play', SOURCES[i.source].label];
        if (i.source === 'eng') return [205, 'terminal', 'Engineering'];
        if (i.source === 'news') return [150, 'news', 'Newsroom'];
        const area = i.categories.find(isArea);
        const [h, ic] = AREA_ART[area] || [245, 'code'];
        return [h, ic, area || 'Platform'];
      }
      function cover(i, cls = '') {
        const [h, ic, label] = art(i);
        const v = i.categories.find(isVersion);
        const k = kindOf(i);
        return `<span class="cover ${cls}" style="--h:${h}" aria-hidden="true">
          <span class="cover__icon">${icon(ic, cls.includes('thumb') ? 14 : 22)}</span>
          <span class="cover__label">${esc(label)}</span>
          ${v ? `<span class="cover__ver">${esc(v)}</span>` : ''}
          ${k ? `<span class="cover__flag ${k.tone === 'amber' ? 'cover__flag--amber' : ''}">${esc(k.label)}</span>` : ''}
        </span>`;
      }

      const bookmarkBtn = (i, cls = 'iconbtn') => {
        const on = S.bookmarks.has(i.link);
        return `<button class="${cls}" data-act="bookmark" data-v="${esc(i.link)}" data-k="bm-${esc(i.link)}" aria-pressed="${on}" aria-label="${on ? 'Remove bookmark' : 'Bookmark'}" title="${on ? 'Remove bookmark' : 'Bookmark'}">${icon(on ? 'bookmarkFill' : 'bookmark', 16)}</button>`;
      };
      const copyBtn = (i, cls = 'iconbtn') =>
        `<button class="${cls}" data-act="copy" data-v="${esc(i.link)}" aria-label="Copy link" title="Copy link">${icon('link', 16)}</button>`;

      /* ===== Feeds ===== */
      function matchCustom(f, i) {
        return (
          f.sources.has(i.source) &&
          (i.source !== 'changelog' ||
            ((!f.types.size || i.categories.some((c) => f.types.has(c))) &&
              (!f.area || i.categories.includes(f.area)) &&
              (!f.version || i.categories.includes(f.version)))) &&
          (!f.unreadOnly || unread(i))
        );
      }
      function baseList(key) {
        if (key === 'bookmarks') return ITEMS.filter((i) => S.bookmarks.has(i.link));
        if (key === 'history') return S.history.map((l) => ITEMS.find((i) => i.link === l)).filter(Boolean);
        const f = CUSTOM.find((c) => c.id === key);
        return ITEMS.filter((i) => S.sources.has(i.source) && (f ? matchCustom(f, i) : FEEDS[key].test(i)));
      }
      function feedList(key) {
        let list = baseList(key);
        if (S.q) {
          const q = S.q.toLowerCase();
          list = list.filter((i) => (i.title + ' ' + i.excerpt + ' ' + i.categories.join(' ') + ' ' + SOURCES[i.source].label).toLowerCase().includes(q));
        }
        if (UI.sort === 'action' && key !== 'history') list = [...list.filter((i) => i.action), ...list.filter((i) => !i.action)];
        return list;
      }
      const recentAction = () => baseList('action').filter((i) => i.t > ITEMS[0].t - 30 * DAY);
      const unreadIn = (key) => baseList(key).filter(unread).length;
      const feedMeta = (key) => FEEDS[key] || LIBRARY[key] || { name: CUSTOM.find((c) => c.id === key)?.name, icon: 'layers', desc: customSummary(CUSTOM.find((c) => c.id === key)) };
      function customSummary(f) {
        if (!f) return '';
        const all = f.sources.size === Object.keys(SOURCES).length;
        return [
          all ? 'All sources' : [...f.sources].map((id) => SOURCES[id].label).join(', ') || 'No sources',
          [...f.types].map((t) => TYPE_OF.get(t).label).join(', '),
          f.area,
          f.version,
          f.unreadOnly && 'Unread only'
        ]
          .filter(Boolean)
          .join(' · ');
      }
      function emptyState(key) {
        if (S.q) return `<div class="empty">${icon('search', 26)}<b>No results for “${esc(S.q)}”</b><span>Try another word, or clear the search.</span><button class="btn btn--sm" data-act="clearSearch">Clear search</button></div>`;
        if (key === 'bookmarks') return `<div class="empty">${icon('bookmark', 26)}<b>No bookmarks yet</b><span>Use the bookmark button on any post to keep it here.</span></div>`;
        if (key === 'history') return `<div class="empty">${icon('history', 26)}<b>Nothing opened yet</b><span>Posts you open show up here.</span></div>`;
        return `<div class="empty">${icon('filter', 26)}<b>Nothing matches this feed</b><span>Turn on more sources, or loosen the filters.</span></div>`;
      }
      const more = (total) =>
        total > UI.limit ? `<div class="more"><button class="btn" data-act="more" data-k="more">Load more <span class="hint">${total - UI.limit} left</span></button></div>` : '';

      const THEME_ICON = { system: 'monitor', light: 'sun', dark: 'moon' };
      const themeBtn = () =>
        `<button class="iconbtn" data-act="theme" data-k="theme" title="Appearance: ${S.theme}" aria-label="Appearance: ${S.theme}. Change appearance">${icon(THEME_ICON[S.theme], 17)}</button>`;
      const searchBox = (big = false) =>
        `<label class="search ${big ? 'search--big' : ''}">${icon('search', big ? 18 : 16)}<input type="search" data-act="search" data-k="search" value="${esc(S.q)}" placeholder="Search Shopify updates" aria-label="Search Shopify updates"><span class="kbd">⌘K</span></label>`;
      const brand = () => `<span class="mtop__brand"><img src="https://bucket.alfred.uptek.com/logo-settings.png" alt="">Alfred</span>`;
      const xLinks = () => `<div class="x-links">${icon('xlogo', 12)}${X_HANDLES.map((h) => `<a href="https://x.com/${h}" target="_blank" rel="noopener">@${h}</a>`).join('')}</div>`;

      /* ===== Shared controls ===== */
      const chip = (key, act, v, label, on) =>
        `<button class="chip" data-act="${act}" data-w="${key}" data-v="${esc(v)}" data-k="${act}-${key}-${esc(v)}" aria-pressed="${on}">${esc(label)}</button>`;
      function feedControls(f, key) {
        return `<div class="ctl">
          <p class="label">Sources</p>
          <div class="filters">${Object.keys(SOURCES).map((id) => chip(key, 'fsrc', id, SOURCES[id].label, f.sources.has(id))).join('')}</div>
          <p class="label">Changelog filters</p>
          <div class="filters">${TYPES.map(([k, l]) => chip(key, 'ftype', k, l, f.types.has(k))).join('')}</div>
          <div class="filters">
            <select class="select ${f.area ? 'select--on' : ''}" data-act="farea" data-w="${key}" data-k="farea-${key}" aria-label="Area">
              <option value="">All areas</option>${AREAS.map((a) => `<option ${f.area === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
            </select>
            <select class="select ${f.version ? 'select--on' : ''}" data-act="fver" data-w="${key}" data-k="fver-${key}" aria-label="API version">
              <option value="">Any API version</option>${VERSIONS.map((v) => `<option ${f.version === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}
            </select>
            <label class="switch-label"><input type="checkbox" class="switch" data-act="funread" data-w="${key}" data-k="funread-${key}" ${f.unreadOnly ? 'checked' : ''}>Unread only</label>
          </div>
          <p class="hint">Type, area and version narrow changelog entries. Other sources show in full.</p>
        </div>`;
      }
      function storeCard(id, { close = false } = {}) {
        const s = STORES[id];
        const domain = `${id}.myshopify.com`;
        const stats = [
          ['Products', s.products.toLocaleString('en-US')],
          ['Collections', s.collections.toLocaleString('en-US')],
          ['Shipping countries', s.ships],
          ['Currency', s.currency]
        ];
        return `<div class="st">
          <div class="st__head"><span class="mono" aria-hidden="true">${initials(s.name)}</span><span class="st__name"><b>${s.name}</b><small>${domain}</small></span></div>
          <div class="st__grid">${stats.map(([k, v]) => `<div class="st__tile"><span class="st__val">${v}</span><span class="st__key">${k}</span></div>`).join('')}</div>
          <div class="st__theme"><span class="st__key">Theme</span><b>${s.theme} ${s.version}</b>${
            s.latest === s.version ? '<span class="tag tag--green">Up to date</span>' : `<span class="tag tag--amber">${s.latest} available</span>`
          }</div>
          <div class="st__links">
            <a class="btn btn--sm" href="https://${domain}" target="_blank" rel="noopener">${icon('store', 14)} Storefront</a>
            <a class="btn btn--sm" href="https://admin.shopify.com/store/${id}" target="_blank" rel="noopener">${icon('admin', 14)} Admin</a>
          </div>
          <p class="hint">Public storefront data. Detected ${rel({ t: NOW - s.seen })}.</p>
        </div>`;
      }
      const storePopover = () =>
        `<div class="pop ${UI.enter === 'pop' ? 'enter' : ''}" role="dialog" aria-label="${STORES[UI.storePop].name}" style="left:${UI.popPos.x}px;top:${UI.popPos.y}px;transform-origin:${UI.popPos.origin}">
          <button class="iconbtn pop__close" data-act="closePop" data-k="closePop" aria-label="Close">${icon('close', 15)}</button>${storeCard(UI.storePop)}
        </div>`;
      const pinForm = (key, cta = 'Add link') => `<div class="pinform">
          <input class="input" data-pin="label" placeholder="Label" aria-label="Link label">
          <input class="input" data-pin="url" placeholder="https://admin.shopify.com/store/…" aria-label="Link URL">
          <button class="btn btn--sm" data-act="pinAdd" data-w="${key}" data-k="pinadd-${key}">${icon('plus', 13)} ${cta}</button>
        </div>`;

      function modal() {
        if (UI.modal === 'pin')
          return `<div class="scrim ${UI.enter === 'modal' ? 'enter' : ''}" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Add a shortcut">
            <div class="modal__head"><h2>Add a shortcut</h2><button class="iconbtn" data-act="closeModal" data-x="1" aria-label="Close">${icon('close', 16)}</button></div>
            <p class="hint">Link straight to a store, an admin page, or a doc you open often.</p>
            ${pinForm('modal', 'Add shortcut')}
          </div></div>`;
        const d = UI.draft;
        const editing = UI.modal !== 'new';
        const n = ITEMS.filter((i) => S.sources.has(i.source) && matchCustom(d, i)).length;
        return `<div class="scrim ${UI.enter === 'modal' ? 'enter' : ''}" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="${editing ? 'Edit feed' : 'New custom feed'}">
          <div class="modal__head"><h2>${editing ? 'Edit feed' : 'New custom feed'}</h2><button class="iconbtn" data-act="closeModal" data-x="1" aria-label="Close">${icon('close', 16)}</button></div>
          <label class="field"><span class="label">Name</span><input class="input" data-act="draftName" data-k="draftName" value="${esc(d.name)}" placeholder="Checkout changes"></label>
          ${feedControls(d, 'draft')}
          <div class="modal__foot">
            ${editing ? `<button class="btn btn--danger" data-act="deleteFeed" data-k="deleteFeed">Delete feed</button>` : ''}
            <span class="spacer hint">${n} matching ${n === 1 ? 'post' : 'posts'}</span>
            <button class="btn" data-act="closeModal" data-x="1">Cancel</button>
            <button class="btn btn--primary" data-act="saveFeed" data-k="saveFeed">${editing ? 'Save' : 'Create feed'}</button>
          </div>
        </div></div>`;
      }

      /* ===== Variant 1: Daily ===== */
      function dCard(i, n) {
        return `<article class="dcard anim ${i.action ? 'is-action' : ''} ${unread(i) ? '' : 'is-old'}" style="--i:${n}">
          <div class="dcard__head">${srcAv(i.source)}<span class="meta"><b>${esc(SOURCES[i.source].label)}</b></span><span class="dcard__read" aria-hidden="true">Read ${icon('arrow', 12)}</span></div>
          <h3 class="dcard__title clamp3"><a ${ext(i)}>${esc(i.title)}</a></h3>
          ${tags(i)}
          <div class="meta">${time(i)}${i.stream === 'videos' ? '<span>·</span><span>Video</span>' : ''}</div>
          ${cover(i)}
          <div class="dbar">${bookmarkBtn(i)}${copyBtn(i)}${unread(i) ? '<span class="newtag">New</span>' : ''}</div>
        </article>`;
      }
      function dRow(i, n) {
        return `<article class="drow anim ${i.action ? 'is-action' : ''} ${unread(i) ? '' : 'is-old'}" style="--i:${n}">
          ${cover(i, 'cover--thumb')}
          <div class="drow__body">
            <div class="meta">${srcAv(i.source, 18)}<b>${esc(SOURCES[i.source].label)}</b><span>·</span>${time(i)}${unread(i) ? '<span class="newtag" style="margin-left:4px">New</span>' : ''}</div>
            <h3 class="drow__title clamp2"><a ${ext(i)}>${esc(i.title)}</a></h3>
            ${tags(i, 3)}
          </div>
          <div class="dbar">${bookmarkBtn(i)}${copyBtn(i)}</div>
        </article>`;
      }
      const navItem = (key, { label, ic, count, red } = {}) =>
        `<button class="dnav__item" data-act="view" data-v="${key}" data-k="nav-${key}" ${UI.view === key ? 'aria-current="page"' : ''}>${icon(ic, 16)}<span class="dnav__text">${esc(label)}</span>${count ? `<span class="count ${red ? 'count--red' : ''}">${count}</span>` : ''}</button>`;
      function vDaily() {
        const key = UI.view;
        const m = feedMeta(key);
        const list = feedList(key);
        const custom = CUSTOM.find((c) => c.id === key);
        const highlights = key === 'all' && !S.q ? recentAction().slice(0, 8) : [];
        return `<div class="v-daily">
          <aside class="dside scroll">
            <div class="dside__brand"><img src="https://bucket.alfred.uptek.com/logo-settings.png" alt="">Shopify updates</div>
            <nav class="dnav" aria-label="Feeds">
              ${Object.entries(FEEDS)
                .map(([k, f]) => navItem(k, { label: f.name, ic: f.icon, count: k === 'action' ? recentAction().length : unreadIn(k), red: k === 'action' }))
                .join('')}
            </nav>
            <nav class="dnav" aria-label="Custom feeds">
              <p class="label">Custom feeds</p>
              ${CUSTOM.map((c) => navItem(c.id, { label: c.name, ic: 'layers', count: unreadIn(c.id) })).join('')}
              <button class="dnav__item dnav__add" data-act="newFeed" data-k="newFeed">${icon('plus', 16)}<span class="dnav__text">New feed</span></button>
            </nav>
            <nav class="dnav" aria-label="Library">
              <p class="label">Library</p>
              ${Object.entries(LIBRARY)
                .map(([k, f]) => navItem(k, { label: f.name, ic: f.icon, count: k === 'bookmarks' ? S.bookmarks.size : 0 }))
                .join('')}
            </nav>
            <div class="dnav">
              <p class="label">Your stores</p>
              ${Object.entries(STORES)
                .map(
                  ([id, s]) =>
                    `<button class="dnav__item" data-act="storePop" data-v="${id}" data-k="store-${id}" aria-expanded="${UI.storePop === id}"><span class="dnav__mono">${initials(s.name)}${s.latest !== s.version ? '<span class="upd" title="Theme update available"></span>' : ''}</span><span class="dnav__text">${s.name}<small>${s.theme} ${s.version}</small></span></button>`
                )
                .join('')}
            </div>
            <div class="dnav">
              <p class="label">Pinned</p>
              ${PINS.map(([label, url]) => `<a class="dnav__item" href="${href(url)}" target="_blank" rel="noopener" title="${esc(hostPath(url))}">${icon(pinIcon(url), 15)}<span class="dnav__text">${esc(label)}</span></a>`).join('')}
              <button class="dnav__item dnav__add" data-act="pinModal" data-k="pinModal">${icon('plus', 16)}<span class="dnav__text">Add shortcut</span></button>
            </div>
            <div class="dside__foot">${xLinks()}</div>
          </aside>
          <main class="dmain">
            <div class="dtop">${searchBox()}<div class="dtop__end">
              <div class="seg" role="group" aria-label="Layout">
                <button data-act="layout" data-v="cards" data-k="layout-cards" aria-pressed="${UI.layout === 'cards'}" title="Cards" aria-label="Cards layout">${icon('cardsLayout', 15)}</button>
                <button data-act="layout" data-v="list" data-k="layout-list" aria-pressed="${UI.layout === 'list'}" title="List" aria-label="List layout">${icon('listLayout', 15)}</button>
              </div>
              <button class="btn btn--ghost btn--sm" data-act="markread" data-k="markread">${icon('check', 14)} Mark all read</button>
              ${themeBtn()}
            </div></div>
            <div class="dhead">
              <div><h1>${icon(m.icon, 22)}${esc(m.name)}</h1><p>${esc(m.desc)}</p></div>
              <div class="dhead__end">
                ${custom ? `<button class="btn btn--sm" data-act="editFeed" data-v="${custom.id}" data-k="editFeed">${icon('sliders', 14)} Edit feed</button>` : ''}
                ${key !== 'history' ? `<div class="seg" role="group" aria-label="Sort"><button data-act="sort" data-v="new" data-k="sort-new" aria-pressed="${UI.sort === 'new'}">Newest</button><button data-act="sort" data-v="action" data-k="sort-action" aria-pressed="${UI.sort === 'action'}">Action first</button></div>` : ''}
              </div>
            </div>
            ${
              highlights.length
                ? `<section class="hl anim"><div class="hl__head">${icon('alert', 16)}Needs your action<span class="count count--red">${highlights.length}</span></div>
                  <div class="hl__row scroll" data-scroll="hl">${highlights
                    .map((i) => `<a class="hl__card" ${ext(i)}><span class="tags"><span class="tag tag--${kindOf(i).tone}">${esc(kindOf(i).label)}</span></span><b class="clamp2">${esc(i.title)}</b><span class="meta">${time(i)}</span></a>`)
                    .join('')}</div></section>`
                : ''
            }
            ${
              list.length
                ? UI.layout === 'cards'
                  ? `<div class="dgrid">${list.slice(0, UI.limit).map(dCard).join('')}</div>`
                  : `<div class="dlist">${list.slice(0, UI.limit).map(dRow).join('')}</div>`
                : emptyState(key)
            }
            ${more(list.length)}
          </main>
        </div>${UI.storePop ? storePopover() : ''}${UI.modal ? modal() : ''}`;
      }

      /* ===== Variant 2: Muzli ===== */
      const MTABS = ['all', 'action', 'platform', 'videos', 'engineering', 'news', 'bookmarks'];
      function mCard(i, n) {
        return `<article class="mcard anim" style="--i:${n}">
          <div class="mcard__media">${cover(i)}<div class="mcard__over">${i.excerpt ? `<p class="clamp3">${esc(i.excerpt)}</p>` : ''}<span style="font-size:11.5px;opacity:.8">${esc(rel(i))}</span></div></div>
          <div class="mcard__actions">${bookmarkBtn(i)}${copyBtn(i)}</div>
          <div class="meta">${srcAv(i.source, 18)}<b>${esc(SOURCES[i.source].label)}</b>${unread(i) ? '<span class="dot" title="New since your last visit"></span>' : ''}</div>
          <h3 class="mcard__title clamp2"><a ${ext(i)}>${esc(i.title)}</a></h3>
        </article>`;
      }
      function mPick(i, big, n) {
        return `<article class="pick ${big ? 'pick--big' : ''} anim" style="--i:${n}">
          ${cover(i)}
          <div class="pick__body">
            <div class="meta">${srcAv(i.source, 20)}<b>${esc(SOURCES[i.source].label)}</b><span>·</span>${time(i)}</div>
            <h3 class="pick__title ${big ? 'clamp3' : 'clamp3'}"><a ${ext(i)}>${esc(i.title)}</a></h3>
            ${big && i.excerpt ? `<p class="pick__ex clamp3">${esc(i.excerpt)}</p>` : ''}
            ${tags(i, big ? 2 : 1)}
          </div>
        </article>`;
      }
      function sourcesDrawer() {
        return `<aside class="drawer ${UI.enter === 'drawer' ? 'enter' : ''}" role="dialog" aria-label="Sources">
          <div class="drawer__head"><h2>Sources</h2><button class="iconbtn" data-act="drawer" data-k="drawer-close" aria-label="Close">${icon('close', 16)}</button></div>
          <div class="drawer__body scroll">
            <p class="hint" style="margin-bottom:6px">Pick what shows up in your feed.</p>
            ${Object.entries(SOURCES)
              .map(
                ([id, s]) =>
                  `<label class="toggle-row">${srcAv(id, 30)}<span><b>${s.label}</b><small>${s.kind}</small></span><input type="checkbox" class="switch" data-act="source" data-v="${id}" data-k="src-${id}" ${S.sources.has(id) ? 'checked' : ''}></label>`
              )
              .join('')}
          </div>
        </aside>`;
      }
      function vMuzli() {
        const key = UI.view;
        const list = feedList(key);
        const picks = !S.q && key !== 'bookmarks' ? list.slice(0, 3) : [];
        const rest = list.slice(picks.length);
        const hour = new Date(NOW).getHours();
        const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
        return `<div class="v-muz">
          <header class="mtop">${brand()}<div class="mtop__end">
            <button class="btn btn--ghost btn--sm" data-act="markread" data-k="markread">${icon('check', 14)} Mark all read</button>
            <button class="btn btn--sm" data-act="drawer" data-k="drawer" aria-expanded="${UI.drawer}">${icon('sliders', 14)} Sources</button>
            ${themeBtn()}
          </div></header>
          <section class="mhero anim">
            <p class="mhero__date">${new Date(NOW).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
            <h1>${greet}</h1>
            ${searchBox(true)}
            <div class="shortcuts">
              ${PINS.map(
                ([label, url]) =>
                  `<a class="sc" href="${href(url)}" target="_blank" rel="noopener" title="${esc(hostPath(url))}"><span class="sc__tile">${icon(pinIcon(url), 19)}</span><span class="sc__label">${esc(label)}</span></a>`
              ).join('')}
              <span class="sc__sep" aria-hidden="true"></span>
              ${Object.entries(STORES)
                .map(
                  ([id, s]) =>
                    `<button class="sc" data-act="storePop" data-v="${id}" data-k="store-${id}" aria-expanded="${UI.storePop === id}"><span class="sc__tile sc__tile--store">${initials(s.name)}${s.latest !== s.version ? '<span class="upd" title="Theme update available"></span>' : ''}</span><span class="sc__label">${s.name}</span></button>`
                )
                .join('')}
              <button class="sc" data-act="pinModal" data-k="pinModal"><span class="sc__tile">${icon('plus', 18)}</span><span class="sc__label">Add shortcut</span></button>
            </div>
          </section>
          <nav class="mtabs scroll" role="tablist" aria-label="Feeds">
            ${MTABS.map((k) => {
              const m = feedMeta(k);
              const c = k === 'bookmarks' ? S.bookmarks.size : unreadIn(k);
              return `<button class="mtab" role="tab" data-act="view" data-v="${k}" data-k="tab-${k}" aria-selected="${key === k}">${icon(m.icon, 14)}${k === 'all' ? 'For you' : esc(m.name)}${c ? `<span class="count ${k === 'action' ? 'count--red' : ''}">${c}</span>` : ''}</button>`;
            }).join('')}
          </nav>
          ${
            picks.length
              ? `<div class="msec"><h2>Top picks</h2><span class="hint">Newest from ${esc(key === 'all' ? 'all sources' : feedMeta(key).name)}</span></div>
                 <section class="picks">${picks.map((p, n) => mPick(p, n === 0, n)).join('')}</section>`
              : ''
          }
          ${rest.length ? `<div class="msec"><h2>${S.q ? `Results for “${esc(S.q)}”` : 'Latest'}</h2><span class="hint">${list.length} posts</span></div><div class="mgrid">${rest.slice(0, UI.limit).map(mCard).join('')}</div>` : picks.length ? '' : emptyState(key)}
          ${more(rest.length)}
          <div class="mfoot">${xLinks()}</div>
        </div>${UI.drawer ? sourcesDrawer() : ''}${UI.storePop ? storePopover() : ''}${UI.modal ? modal() : ''}`;
      }

      /* ===== Variant 3: Board ===== */
      const LAYOUTS = {
        carousel: ['Carousel', 'carousel'],
        cards: ['Cards', 'cardsLayout'],
        list: ['List', 'listLayout'],
        compact: ['Compact', 'rows'],
        stats: ['Stats', 'cardsLayout']
      };
      const WT = {
        feed: { name: 'Custom feed', icon: 'layers', desc: 'Mix sources and filter by type, area, or API version.', layouts: ['carousel', 'cards', 'list', 'compact'] },
        changelog: { name: 'Platform updates', icon: 'code', desc: 'The shopify.dev changelog.', layouts: ['cards', 'carousel', 'list', 'compact'] },
        videos: { name: 'Videos', icon: 'video', desc: 'Shopify channels on YouTube.', layouts: ['carousel', 'cards', 'list'] },
        eng: { name: 'Engineering blog', icon: 'terminal', desc: 'Posts from shopify.engineering.', layouts: ['list', 'carousel', 'compact'] },
        news: { name: 'Newsroom', icon: 'news', desc: 'Shopify press releases.', layouts: ['compact', 'list', 'carousel'] },
        store: { name: 'Store snapshot', icon: 'store', desc: 'Public stats and theme version for a detected store.', layouts: ['stats'] },
        pins: { name: 'Pinned links', icon: 'pin', desc: 'Your shortcuts to stores, admin pages and docs.', layouts: ['list'] }
      };
      const SIZES = [
        ['S', 'Small'],
        ['T', 'Tall'],
        ['M', 'Medium'],
        ['L', 'Large'],
        ['W', 'Wide']
      ];
      let wid = 0;
      function W(type, o = {}) {
        return {
          id: 'w' + ++wid,
          type,
          title: o.title || (type === 'store' ? STORES[o.store || 'northwind-kitchen'].name : WT[type].name),
          layout: o.layout || WT[type].layouts[0],
          size: o.size || 'M',
          store: o.store || 'northwind-kitchen',
          channels: new Set(o.channels || VIDEO_SOURCES),
          open: false,
          ...feedDef({ sources: o.sources, types: o.types, area: o.area }),
          id: 'w' + wid
        };
      }
      const BOARD = [
        W('feed', { title: 'Needs action', layout: 'carousel', size: 'W', sources: ['changelog'], types: ACTION }),
        W('changelog', { size: 'L' }),
        W('store', { size: 'T' }),
        W('pins', { size: 'T' }),
        W('videos', { size: 'W' }),
        W('eng', { size: 'M' }),
        W('news', { size: 'M' })
      ];
      const findW = (id) => BOARD.find((w) => w.id === id);
      function widgetItems(w) {
        if (w.type === 'videos') return ITEMS.filter((i) => w.channels.has(i.source) && S.sources.has(i.source));
        if (w.type === 'feed') return ITEMS.filter((i) => S.sources.has(i.source) && matchCustom(w, i));
        return ITEMS.filter((i) => i.source === w.type && S.sources.has(i.source));
      }
      const isFeedType = (w) => !['store', 'pins'].includes(w.type);
      const hasControls = (w) => ['feed', 'videos', 'store', 'pins'].includes(w.type);
      const flag = (i) => {
        const k = kindOf(i);
        return k ? `<span class="flag flag--${k.tone}" title="${esc(k.label)}"></span>` : '';
      };
      function wBody(w) {
        if (w.type === 'store') return storeCard(w.store);
        if (w.type === 'pins')
          return `<ul>${PINS.map(([label, url]) => `<li><a class="pinrow" href="${href(url)}" target="_blank" rel="noopener"><span class="mono" style="width:28px;height:28px">${icon(pinIcon(url), 14)}</span><span style="min-width:0"><b>${esc(label)}</b><small>${esc(hostPath(url))}</small></span></a></li>`).join('')}</ul>`;
        const list = widgetItems(w).slice(0, 30);
        if (!list.length) return `<div class="empty" style="padding:24px 8px">Nothing matches these filters.</div>`;
        const mini = (i) =>
          `<a class="mini" ${ext(i)}>${cover(i, 'cover--sm')}<span class="mini__title clamp2">${esc(i.title)}</span><span class="meta">${srcAv(i.source, 16)}<b>${esc(SOURCES[i.source].label)}</b><span>·</span>${time(i)}</span></a>`;
        switch (w.layout) {
          case 'carousel':
            return `<div class="lcar scroll" data-scroll="car-${w.id}">${list.map(mini).join('')}</div>`;
          case 'cards':
            return `<div class="lcards">${list.map(mini).join('')}</div>`;
          case 'list':
            return `<ol>${list.map((i) => `<li><a class="lrow" ${ext(i)}>${cover(i, 'cover--thumb')}<span class="lrow__body"><span class="meta">${unread(i) ? '<span class="dot"></span>' : ''}<b>${esc(SOURCES[i.source].label)}</b><span>·</span>${time(i)}</span><span class="lrow__title clamp2">${esc(i.title)}</span></span></a></li>`).join('')}</ol>`;
          default:
            return `<ol>${list.map((i) => `<li><a class="lc" ${ext(i)} title="${esc(i.title)}">${unread(i) ? '<span class="dot"></span>' : '<span class="dot" style="visibility:hidden"></span>'}${flag(i)}<span class="lc__title">${esc(i.title)}</span><span class="meta">${time(i)}</span></a></li>`).join('')}</ol>`;
        }
      }
      function wControls(w) {
        if (w.type === 'feed') return feedControls(w, w.id);
        if (w.type === 'videos')
          return `<div class="ctl"><p class="label">Channels</p><div class="filters">${VIDEO_SOURCES.map((id) => chip(w.id, 'vch', id, SOURCES[id].label, w.channels.has(id))).join('')}</div></div>`;
        if (w.type === 'store')
          return `<div class="ctl"><p class="label">Store</p><select class="select" data-act="wstore" data-w="${w.id}" data-k="wstore-${w.id}" aria-label="Store">${Object.entries(STORES)
            .map(([id, s]) => `<option value="${id}" ${w.store === id ? 'selected' : ''}>${s.name}</option>`)
            .join('')}</select></div>`;
        return `<div class="ctl"><p class="label">Links</p><ul class="pinlist">${PINS.map(
          ([label], k) => `<li><span>${esc(label)}</span><button class="iconbtn" data-act="pinRemove" data-v="${k}" data-k="pinrm-${k}" aria-label="Remove ${esc(label)}">${icon('close', 12)}</button></li>`
        ).join('')}</ul>${pinForm(w.id)}</div>`;
      }
      function boardWidget(w, n, all) {
        const t = WT[w.type];
        const cnt = isFeedType(w) ? widgetItems(w).filter(unread).length : 0;
        const e = UI.editing;
        const tools = e
          ? `<button class="iconbtn" data-act="remove" data-w="${w.id}" data-k="rm-${w.id}" aria-label="Remove widget" title="Remove">${icon('close', 14)}</button>`
          : `${
              t.layouts.length > 1
                ? `<div class="iseg" role="group" aria-label="Layout">${t.layouts
                    .map(
                      (l) =>
                        `<button data-act="wlayout" data-w="${w.id}" data-v="${l}" data-k="lay-${w.id}-${l}" aria-pressed="${w.layout === l}" title="${LAYOUTS[l][0]}" aria-label="${LAYOUTS[l][0]} layout">${icon(LAYOUTS[l][1], 14)}</button>`
                    )
                    .join('')}</div>`
                : ''
            }${hasControls(w) ? `<span class="tools-sep"></span><button class="iconbtn" data-act="wtoggle" data-w="${w.id}" data-k="tg-${w.id}" aria-expanded="${w.open}" aria-label="Widget settings" title="Widget settings">${icon('sliders', 14)}</button>` : ''}`;
        const editbar = `<div class="w__editbar ${UI.enter === 'edit' ? 'enter' : ''}">
            <div class="iseg" role="group" aria-label="Size">${SIZES.map(([s, label]) => `<button data-act="size" data-w="${w.id}" data-v="${s}" data-k="size-${w.id}-${s}" aria-pressed="${w.size === s}" title="${label}">${s}</button>`).join('')}</div>
            <span style="margin-left:auto"></span>
            <button class="iconbtn" data-act="move" data-w="${w.id}" data-v="-1" data-k="mvl-${w.id}" aria-label="Move earlier" ${n === 0 ? 'disabled' : ''}>${icon('chevL', 14)}</button>
            <button class="iconbtn" data-act="move" data-w="${w.id}" data-v="1" data-k="mvr-${w.id}" aria-label="Move later" ${n === all - 1 ? 'disabled' : ''}>${icon('chevR', 14)}</button>
          </div>`;
        const sub = w.type === 'feed' ? customSummary(w) : w.type === 'videos' ? [...w.channels].map((id) => SOURCES[id].label).join(', ') : '';
        return `<article class="w size--${w.size} anim ${UI.fresh === w.id ? 'enter' : ''} ${e ? 'w--edit' : ''}" style="--i:${n}" data-drop="${w.id}" ${e ? `draggable="true" data-drag="${w.id}"` : ''}>
          <header class="w__head">
            ${e ? `<span class="w__grip">${icon('grip', 14)}</span>` : ''}
            <span class="srcav" style="--h:${w.type === 'feed' ? 0 : SOURCES[{ changelog: 'changelog', videos: 'yt-devs', eng: 'eng', news: 'news' }[w.type]]?.h ?? 220};width:24px;height:24px;border-radius:7px;${w.type === 'feed' ? 'background:linear-gradient(135deg,#e5534b,#c8362f)' : ''}">${icon(t.icon, 13)}</span>
            <h2 class="w__title">${esc(w.title)}</h2>${cnt ? `<span class="count ${w.type === 'feed' && w.types.size ? 'count--red' : ''}">${cnt}</span>` : ''}
            <div class="w__tools">${tools}</div>
          </header>
          ${e ? editbar : ''}
          ${!e && w.open ? `<div class="w__controls ${UI.enter === 'ctl-' + w.id ? 'enter' : ''}">${wControls(w)}</div>` : !e && sub ? `<p class="w__sub">${esc(sub)}</p>` : ''}
          <div class="w__body scroll" data-scroll="b-${w.id}">${wBody(w)}</div>
        </article>`;
      }
      function vBoard() {
        return `<div class="v-board">
          <header class="btop">${brand()}${searchBox()}<div class="btop__end">${
            UI.editing
              ? `<div class="pop-anchor"><button class="btn" data-act="addMenu" data-k="addMenu" aria-expanded="${UI.addOpen}">${icon('plus', 14)} Add widget</button>
                ${UI.addOpen ? `<div class="menu ${UI.enter === 'add' ? 'enter' : ''}" role="menu">${Object.entries(WT).map(([type, t]) => `<button class="menu__item" data-act="add" data-v="${type}" data-k="add-${type}"><span class="srcav" style="--h:220;width:28px;height:28px">${icon(t.icon, 14)}</span><span><b>${t.name}</b><small>${t.desc}</small></span></button>`).join('')}</div>` : ''}</div>
                <button class="btn btn--primary" data-act="edit" data-k="edit">Done</button>`
              : `<button class="btn btn--ghost btn--sm" data-act="markread" data-k="markread">${icon('check', 14)} Mark all read</button>${themeBtn()}<button class="btn" data-act="edit" data-k="edit">${icon('pencil', 13)} Edit board</button>`
          }</div></header>
          ${S.q ? `<div class="msec"><h2>Results for “${esc(S.q)}”</h2><button class="btn btn--sm" data-act="clearSearch">Clear</button></div><div class="dgrid" style="margin-bottom:28px">${feedList('all').slice(0, 12).map(dCard).join('') || emptyState('all')}</div>` : ''}
          <div class="bento">${BOARD.map((w, n) => boardWidget(w, n, BOARD.length)).join('')}</div>
        </div>`;
      }

      // Each variant runs from the picker's mount (fresh view state) or from rerender (after an interaction).
      const variants = [vDaily, vMuzli, vBoard].map((render) => () => {
        if (!S.rerender) resetUI();
        if (S.theme === 'system') delete root.dataset.theme;
        else root.dataset.theme = S.theme;
        const html = render();
        UI.enter = null;
        return html;
      });

      /* Picker wiring: verbatim from the prototype skill's PICKER.md. */
      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        stage.classList.remove('static');
        // Clear first, render next frame, so entrance animations re-run.
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      // Enable the slide only after first paint, so load doesn't animate.
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

      /* Interactions: change state, then re-render statically, keeping focus, caret and scroll positions. */
      function rerender() {
        const a = document.activeElement;
        const key = a?.dataset?.k;
        const caret = a?.tagName === 'INPUT' && /^(text|search)$/.test(a.type) ? [a.selectionStart, a.selectionEnd] : null;
        const scrolls = [...stage.querySelectorAll('[data-scroll]')].map((el) => [el.dataset.scroll, el.scrollTop, el.scrollLeft]);
        S.rerender = true;
        stage.classList.add('static');
        const fresh = UI.fresh;
        stage.innerHTML = variants[current]();
        S.rerender = false;
        scrolls.forEach(([k, top, left]) => {
          const el = stage.querySelector(`[data-scroll="${k}"]`);
          if (el) Object.assign(el, { scrollTop: top, scrollLeft: left });
        });
        const el = key && stage.querySelector(`[data-k="${CSS.escape(key)}"]`);
        if (el) {
          el.focus({ preventScroll: true });
          if (caret && el.setSelectionRange) el.setSelectionRange(...caret);
        }
        if (UI.focusModal) {
          stage.querySelector('.modal input, .drawer input')?.focus({ preventScroll: true });
          UI.focusModal = false;
        }
        if (fresh) {
          stage.querySelector(`[data-drop="${fresh}"]`)?.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
          UI.fresh = null;
        }
      }

      const toastEl = document.getElementById('toast');
      let toastTimer;
      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
      }

      function addPin(el) {
        const form = el.closest('.pinform');
        const urlInput = form.querySelector('[data-pin="url"]');
        let url;
        try {
          url = new URL(urlInput.value.trim());
        } catch {}
        // Shortcuts only accept https links, same rule as feed content.
        if (!url || url.protocol !== 'https:') {
          urlInput.setAttribute('aria-invalid', 'true');
          urlInput.focus();
          return false;
        }
        PINS.push([form.querySelector('[data-pin="label"]').value.trim() || url.hostname, url.href]);
        toast('Shortcut added');
        return true;
      }

      function act(name, el) {
        const v = el.dataset.v;
        const w = el.dataset.w === 'draft' ? UI.draft : el.dataset.w && findW(el.dataset.w);
        const tog = (set, x) => (set.has(x) ? set.delete(x) : set.add(x));
        switch (name) {
          case 'view':
            Object.assign(UI, { view: v, limit: 24, storePop: null });
            scrollTo({ top: 0 });
            break;
          case 'layout':
            UI.layout = v;
            break;
          case 'sort':
            UI.sort = v;
            break;
          case 'more':
            UI.limit += 24;
            break;
          case 'search':
            S.q = el.value.trim();
            UI.limit = 24;
            break;
          case 'clearSearch':
            S.q = '';
            break;
          case 'theme':
            S.theme = { system: 'light', light: 'dark', dark: 'system' }[S.theme];
            toast(`Appearance: ${S.theme}`);
            break;
          case 'markread':
            S.lastVisit = Date.now();
            toast('All caught up');
            break;
          case 'bookmark': {
            const on = !S.bookmarks.has(v);
            on ? S.bookmarks.add(v) : S.bookmarks.delete(v);
            toast(on ? 'Saved to bookmarks' : 'Removed from bookmarks');
            break;
          }
          case 'copy':
            navigator.clipboard?.writeText(v).then(
              () => toast('Link copied'),
              () => toast('Copy failed')
            );
            return;
          case 'storePop': {
            if (UI.storePop === v) {
              UI.storePop = null;
              break;
            }
            const r = el.getBoundingClientRect();
            UI.popPos =
              current === 0
                ? { x: r.right + 8, y: Math.max(12, Math.min(r.top - 8, innerHeight - 420)), origin: 'left top' }
                : { x: Math.max(12, Math.min(r.left + r.width / 2 - 165, innerWidth - 342)), y: r.bottom + 8, origin: 'center top' };
            UI.storePop = v;
            UI.enter = 'pop';
            break;
          }
          case 'closePop':
            UI.storePop = null;
            break;
          case 'drawer':
            UI.drawer = !UI.drawer;
            UI.enter = UI.drawer ? 'drawer' : null;
            break;
          case 'source':
            el.checked ? S.sources.add(v) : S.sources.delete(v);
            break;
          case 'newFeed':
            UI.draft = feedDef({ name: '', sources: ['changelog'] });
            Object.assign(UI, { modal: 'new', enter: 'modal', focusModal: true });
            break;
          case 'editFeed': {
            const f = CUSTOM.find((c) => c.id === v);
            UI.draft = { ...f, sources: new Set(f.sources), types: new Set(f.types) };
            Object.assign(UI, { modal: v, enter: 'modal', focusModal: true });
            break;
          }
          case 'pinModal':
            Object.assign(UI, { modal: 'pin', enter: 'modal', focusModal: true });
            break;
          case 'closeModal':
            UI.modal = null;
            break;
          case 'draftName':
            UI.draft.name = el.value;
            return;
          case 'saveFeed': {
            const d = UI.draft;
            d.name = d.name.trim() || 'Untitled feed';
            if (UI.modal === 'new') {
              CUSTOM.push(d);
              UI.view = d.id;
              toast(`Created “${d.name}”`);
            } else {
              Object.assign(
                CUSTOM.find((c) => c.id === UI.modal),
                d
              );
              toast('Feed saved');
            }
            UI.modal = null;
            break;
          }
          case 'deleteFeed':
            CUSTOM.splice(
              CUSTOM.findIndex((c) => c.id === UI.modal),
              1
            );
            Object.assign(UI, { modal: null, view: 'all' });
            toast('Feed deleted');
            break;
          case 'fsrc':
            tog(w.sources, v);
            break;
          case 'ftype':
            tog(w.types, v);
            break;
          case 'farea':
            w.area = el.value;
            break;
          case 'fver':
            w.version = el.value;
            break;
          case 'funread':
            w.unreadOnly = el.checked;
            break;
          case 'vch':
            tog(w.channels, v);
            break;
          case 'wstore':
            if (w.title === STORES[w.store].name) w.title = STORES[el.value].name;
            w.store = el.value;
            break;
          case 'pinAdd':
            if (!addPin(el)) return;
            if (UI.modal === 'pin') UI.modal = null;
            break;
          case 'pinRemove':
            PINS.splice(Number(v), 1);
            break;
          case 'wlayout':
            w.layout = v;
            break;
          case 'wtoggle':
            w.open = !w.open;
            UI.enter = w.open ? 'ctl-' + w.id : null;
            break;
          case 'edit':
            UI.editing = !UI.editing;
            UI.addOpen = false;
            UI.enter = UI.editing ? 'edit' : null;
            BOARD.forEach((x) => (x.open = false));
            break;
          case 'addMenu':
            UI.addOpen = !UI.addOpen;
            UI.enter = UI.addOpen ? 'add' : null;
            break;
          case 'add': {
            const nw = W(v, { size: { videos: 'W', changelog: 'L', feed: 'W', store: 'T', pins: 'T' }[v] || 'M' });
            BOARD.push(nw);
            Object.assign(UI, { fresh: nw.id, addOpen: false });
            break;
          }
          case 'size':
            w.size = v;
            break;
          case 'move': {
            const i = BOARD.indexOf(w);
            const j = i + Number(v);
            if (j < 0 || j >= BOARD.length) return;
            BOARD.splice(j, 0, BOARD.splice(i, 1)[0]);
            break;
          }
          case 'remove':
            BOARD.splice(BOARD.indexOf(w), 1);
            break;
        }
        rerender();
      }

      stage.addEventListener('click', (e) => {
        const visit = e.target.closest('[data-visit]');
        if (visit) S.history = [visit.dataset.visit, ...S.history.filter((l) => l !== visit.dataset.visit)].slice(0, 50);
        const el = e.target.closest('[data-act]');
        if (!el || /^(INPUT|SELECT)$/.test(el.tagName)) return;
        // The scrim closes the modal only on a click outside the dialog.
        if (el.dataset.act === 'closeModal' && !el.dataset.x && e.target !== el) return;
        act(el.dataset.act, el);
      });
      stage.addEventListener('change', (e) => {
        const el = e.target.closest('[data-act]');
        if (el && !['search', 'draftName'].includes(el.dataset.act)) act(el.dataset.act, el);
      });
      stage.addEventListener('input', (e) => {
        const a = e.target.dataset.act;
        if (a === 'search' || a === 'draftName') act(a, e.target);
        if (e.target.dataset.pin === 'url') e.target.removeAttribute('aria-invalid');
      });
      stage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.dataset.pin) act('pinAdd', e.target.closest('.pinform').querySelector('[data-act="pinAdd"]'));
      });

      // Drag to reorder Board widgets in edit mode.
      let dragId = null;
      const clearDrag = () => stage.querySelectorAll('.dragging, .drop-target').forEach((x) => x.classList.remove('dragging', 'drop-target'));
      stage.addEventListener('dragstart', (e) => {
        const el = e.target.closest?.('[data-drag]');
        if (!el) return;
        dragId = el.dataset.drag;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragId);
        el.classList.add('dragging');
      });
      stage.addEventListener('dragover', (e) => {
        const t = e.target.closest?.('[data-drop]');
        if (!dragId || !t) return;
        e.preventDefault();
        stage.querySelectorAll('.drop-target').forEach((x) => x !== t && x.classList.remove('drop-target'));
        if (t.dataset.drop !== dragId) t.classList.add('drop-target');
      });
      stage.addEventListener('drop', (e) => {
        const t = e.target.closest?.('[data-drop]');
        if (!dragId || !t) return;
        e.preventDefault();
        const from = BOARD.findIndex((w) => w.id === dragId);
        const to = BOARD.findIndex((w) => w.id === t.dataset.drop);
        dragId = null;
        if (from < 0 || to < 0 || from === to) return clearDrag();
        BOARD.splice(to, 0, BOARD.splice(from, 1)[0]);
        rerender();
      });
      stage.addEventListener('dragend', () => {
        dragId = null;
        clearDrag();
      });

      document.addEventListener('click', (e) => {
        let changed = false;
        if (UI.addOpen && !e.target.closest('.pop-anchor')) (UI.addOpen = false), (changed = true);
        if (UI.storePop && !e.target.closest('.pop, [data-act="storePop"]')) (UI.storePop = null), (changed = true);
        if (changed) rerender();
      });
      document.addEventListener('keydown', (e) => {
        const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
        if (((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !typing)) {
          e.preventDefault();
          stage.querySelector('[data-k="search"]')?.focus();
          return;
        }
        if (e.key !== 'Escape') return;
        if (UI.modal) UI.modal = null;
        else if (UI.storePop) UI.storePop = null;
        else if (UI.addOpen) UI.addOpen = false;
        else if (UI.drawer) UI.drawer = false;
        else if (UI.editing) UI.editing = false;
        else if (S.q && typing) S.q = '';
        else return;
        rerender();
      });
      addEventListener(
        'scroll',
        () => {
          if (UI.storePop) {
            UI.storePop = null;
            rerender();
          }
        },
        { passive: true }
      );
    </script>
  </body>
</html>
