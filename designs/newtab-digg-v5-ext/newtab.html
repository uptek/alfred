<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Tokens: Digg-style neutrals with the popup's indigo accent and GitHub soft dark. */
      :root {
        color-scheme: light;
        --bg: #fcfcfd;
        --side: #f6f6f8;
        --surface: #fff;
        --line: #ececf0;
        --line-2: #dcdde3;
        --hover: #f0f0f4;
        --press: #e7e7ed;
        --text: #121216;
        --text-2: #3d3e46;
        --muted: #6c6d78;
        --faint: #9b9ca6;
        --accent: #4f57c4;
        --tint: #eef0fd;
        --tint-line: #d9ddf7;
        --attn: #c8362f;
        --warn: #b26a00;
        --ok: #1d8048;
        --ring: 0 0 0 2px var(--bg);
        --shadow-pop: 0 0 0 1px rgba(17, 17, 22, 0.06), 0 12px 32px rgba(17, 17, 22, 0.14);
        --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mono: 'SF Mono', ui-monospace, Menlo, monospace;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #1b2027;
          --side: #212830;
          --surface: #232a33;
          --line: #2e353f;
          --line-2: #3d4550;
          --hover: #29303a;
          --press: #323a45;
          --text: #e3e6ec;
          --text-2: #c0c5ce;
          --muted: #9198a1;
          --faint: #6e7681;
          --accent: #8d95f0;
          --tint: #2a2f4d;
          --tint-line: #3a4170;
          --attn: #f47067;
          --warn: #d29b3a;
          --ok: #57ab5a;
          --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 12px 32px rgba(0, 0, 0, 0.45);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1b2027;
        --side: #212830;
        --surface: #232a33;
        --line: #2e353f;
        --line-2: #3d4550;
        --hover: #29303a;
        --press: #323a45;
        --text: #e3e6ec;
        --text-2: #c0c5ce;
        --muted: #9198a1;
        --faint: #6e7681;
        --accent: #8d95f0;
        --tint: #2a2f4d;
        --tint-line: #3a4170;
        --attn: #f47067;
        --warn: #d29b3a;
        --ok: #57ab5a;
        --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 12px 32px rgba(0, 0, 0, 0.45);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 400 14px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      a { color: inherit; }
      button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      code { font: 500 0.88em var(--mono); background: var(--hover); padding: 1px 4px; border-radius: 4px; }
      .e { font-size: 13px; line-height: 1; }

      /* ---------- Sidebar ---------- */
      .side {
        position: sticky;
        top: 0;
        flex: none;
        display: flex;
        flex-direction: column;
        width: 256px;
        height: 100vh;
        padding: 18px 12px 16px;
        background: var(--side);
        border-right: 1px solid var(--line);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 12px 24px;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.04em;
        text-decoration: none;
      }
      .logo img { width: 28px; height: 28px; border-radius: 8px; }
      .nav { display: grid; gap: 4px; }
      .nav-i {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 44px;
        padding: 0 14px;
        border-radius: 14px;
        font-size: 14.5px;
        font-weight: 500;
        text-align: left;
        transition: background-color 120ms ease-out;
      }
      .nav-i .e { width: 26px; font-size: 21px; text-align: center; }
      .nav-i:hover { background: var(--hover); }
      .nav-i[aria-current='page'] { background: var(--press); font-weight: 600; }
      .nav-i small { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 500; }
      .side-foot { display: grid; gap: 8px; margin-top: auto; }
      .soft {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 38px;
        border-radius: 999px;
        background: var(--hover);
        font-size: 14px;
        font-weight: 500;
        transition: background-color 120ms ease-out;
      }
      .soft:hover { background: var(--press); }
      .soft svg { width: 15px; height: 15px; }

      /* Phone bar replaces the sidebar. */
      .mbar { display: none; }

      /* ---------- Toolbar ---------- */
      .tb {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0 10px;
        background: var(--bg);
      }
      .tb-l { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--hover); }
      .ib {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        color: var(--text-2);
        transition: background-color 120ms ease-out;
      }
      .ib:hover { background: var(--press); }
      .ib svg { width: 17px; height: 17px; }
      .sort { position: relative; }
      .sort-b {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px 0 8px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 500;
      }
      .sort-b:hover { background: var(--press); }
      .sort-b svg { width: 14px; height: 14px; color: var(--muted); }
      .menu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        z-index: 20;
        display: grid;
        gap: 2px;
        width: 168px;
        padding: 6px;
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow-pop);
        transform-origin: top left;
        animation: pop 160ms var(--ease-out);
      }
      .menu button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        padding: 0 12px;
        border-radius: 10px;
        font-size: 14px;
        text-align: left;
      }
      .menu button:hover { background: var(--hover); }
      .menu button[aria-checked='true'] { background: var(--accent); color: #fff; }
      .menu svg { width: 15px; height: 15px; }
      @keyframes pop {
        from { opacity: 0; transform: scale(0.96) translateY(-4px); }
      }
      .seg { display: flex; padding: 3px; border-radius: 999px; background: var(--hover); }
      .seg button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 30px;
        border-radius: 999px;
        color: var(--muted);
      }
      .seg button[aria-pressed='true'] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }
      .seg svg { width: 16px; height: 16px; }

      /* ---------- Story row ---------- */
      .st {
        display: flex;
        gap: 20px;
        padding: 16px 0 17px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .st:focus-visible { outline-offset: -2px; border-radius: 8px; }
      .st-b { flex: 1; min-width: 0; }
      .st-top {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: 600;
      }
      .flag { font-weight: 600; }
      .flag.attn { color: var(--attn); }
      .flag.warn { color: var(--warn); }
      .flag.ok { color: var(--ok); }
      .st-t {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-wrap: pretty;
        overflow-wrap: anywhere;
      }
      .st:hover .st-t { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--faint); }
      .st-d {
        display: -webkit-box;
        margin: 3px 0 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 14px;
        line-height: 20px;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .st-f {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .st-f b { color: var(--text-2); font-weight: 600; }
      .st-th {
        flex: none;
        width: 108px;
        height: 80px;
        margin-top: 4px;
        border-radius: 10px;
        object-fit: cover;
        background: var(--hover);
      }
      .compact .st { padding: 11px 0 12px; }
      .compact .st-top { margin-bottom: 2px; }
      .compact .st-t { font-size: 15px; line-height: 22px; }
      .compact .st-f { margin-top: 6px; }

      /* Save pill, Digg's vote button shape. */
      .dig {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        height: 32px;
        padding: 3px 12px 3px 3px;
        border: 1px solid var(--tint-line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        transition: transform 120ms var(--ease-out), border-color 120ms ease-out;
      }
      .dig.solo { padding-right: 3px; }
      .dig:hover { border-color: var(--accent); }
      .dig:active { transform: scale(0.97); }
      .dig i {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-width: 38px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--tint);
        color: var(--accent);
        font-style: normal;
        transition: background-color 150ms ease-out, color 150ms ease-out;
      }
      .dig svg { width: 13px; height: 13px; }
      .dig[aria-pressed='true'] i { background: var(--accent); color: #fff; }
      .dig[aria-pressed='true'] svg path { fill: currentColor; }
      .faces { display: inline-flex; }
      .face {
        position: relative;
        flex: none;
        width: 22px;
        height: 22px;
        overflow: hidden;
        border-radius: 50%;
        background: var(--c, #999);
        box-shadow: var(--ring);
        color: #fff;
        font: 700 9.5px/22px var(--sans);
        text-align: center;
      }
      .face + .face { margin-left: -6px; }
      .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .face.fav { background: #fff; }
      .face.fav img { padding: 3px; }

      /* ---------- Index ---------- */
      .fp { display: flex; min-height: 100vh; }
      .fp-main {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 696px) 376px;
        justify-content: center;
        gap: 48px;
        padding: 0 32px 120px;
      }
      .fp.noside .side { display: none; }
      .feed { min-width: 0; }
      .more {
        display: block;
        margin: 20px auto 0;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--hover);
        font-weight: 500;
      }
      .more:hover { background: var(--press); }
      .empty { padding: 64px 0; color: var(--muted); text-align: center; font-size: 15px; }
      .empty .e { display: block; margin-bottom: 12px; font-size: 40px; }

      .rail { display: grid; align-content: start; gap: 12px; padding-top: 12px; }
      .card {
        padding: 22px 24px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
      }
      .card h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .store { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
      .sq {
        display: grid;
        place-items: center;
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--c);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }
      .store-n { min-width: 0; }
      .store-n a { display: block; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .store-n a:hover { text-decoration: underline; text-underline-offset: 3px; }
      .ql { display: flex; gap: 10px; margin-top: 1px; font-size: 12.5px; }
      .ql a { color: var(--muted); text-decoration: none; }
      .ql a:hover { color: var(--accent); }

      .vrow { width: 100%; text-align: left; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; padding: 6px 0; text-decoration: none; }
      .vrow img { width: 84px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--hover); }
      .vrow b { display: -webkit-box; overflow: hidden; font-size: 13.5px; font-weight: 600; line-height: 18px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .vrow small { color: var(--muted); font-size: 12px; }
      .vrow:hover b { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }

      .go {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 26px;
        height: 40px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        transition: transform 120ms var(--ease-out);
      }
      .go:active { transform: scale(0.97); }
      .go svg { width: 14px; height: 14px; }
      /* ---------- Reader ---------- */
      .rd { display: grid; grid-template-columns: 76px 400px minmax(0, 1fr); height: 100vh; }
      .irail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 16px 0;
        background: var(--side);
        border-right: 1px solid var(--line);
      }
      .irail .logo { padding: 0 0 18px; }
      .irail .nav-i { justify-content: center; width: 48px; height: 48px; padding: 0; }
      .irail .side-foot { margin-top: auto; }
      .rd-list { display: flex; flex-direction: column; min-height: 0; overflow: auto; border-right: 1px solid var(--line); }
      .rd-head {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px 12px 22px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .rd-head .tb-l { gap: 6px; padding: 0; background: none; }
      .rd-head h2 { margin: 0 8px 0 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
      .rd-rows { display: grid; gap: 2px; padding: 8px 8px 120px; }
      .rr { display: flex; gap: 14px; padding: 13px 14px 14px; border-radius: 14px; cursor: pointer; transition: background-color 100ms ease-out; }
      .rr:hover { background: var(--hover); }
      .rr[aria-selected='true'] { background: var(--press); }
      .rr .st-t { display: -webkit-box; overflow: hidden; font-size: 15px; line-height: 21px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .rr .st-f { margin-top: 8px; font-size: 12.5px; }
      .rr .face { width: 20px; height: 20px; line-height: 20px; box-shadow: 0 0 0 2px var(--rowbg, var(--bg)); }
      .rr[aria-selected='true'] { --rowbg: var(--press); }
      .rr:hover { --rowbg: var(--hover); }
      .rr-th { flex: none; width: 64px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--hover); }
      .rd-detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .rd-top { padding: 12px 24px 0; border-bottom: 1px solid var(--line); }
      .rd-bar { display: flex; align-items: center; gap: 10px; min-height: 36px; }
      .rd-bar .st-top { flex: 1; margin: 0; }
      .rd-top h1 { margin: 4px 0 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: anywhere; }
      .rd-top .st-f { margin: 12px 0 14px; }
      .frame { position: relative; flex: 1; min-height: 0; background: var(--surface); }
      .frame-wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 13px; }
      .frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
        opacity: 0;
        transition: opacity 150ms ease-out;
      }
      .frame iframe.on { opacity: 1; }
      .thread { max-width: 640px; margin: 0 auto; padding: 40px 32px 120px; }
      .thread p { margin: 0; font-size: 16px; line-height: 27px; color: var(--text-2); }
      .only-m { display: none; }
      .keys { color: var(--faint); font-size: 12px; white-space: nowrap; }
      .keys kbd { padding: 1px 5px; border: 1px solid var(--line-2); border-radius: 4px; font: 500 11px var(--mono); }

      @media (prefers-reduced-motion: reduce) {
        .menu { animation: none; }
        .dig, .go { transition: none; }
      }
      @media (max-width: 1180px) {
        .fp-main { grid-template-columns: minmax(0, 696px); }
        .fp-main .rail { display: none; }
        .rd { grid-template-columns: 76px 340px minmax(0, 1fr); }
      }
      @media (max-width: 860px) {
        .side, .irail { display: none; }
        .mbar {
          position: sticky;
          top: 0;
          z-index: 6;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 10px 16px;
          background: var(--bg);
          border-bottom: 1px solid var(--line);
        }
        .mbar .logo { flex: none; padding: 0; font-size: 20px; }
        .mbar .logo img { width: 24px; height: 24px; }
        .mbar nav { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
        .mbar .nav-i { flex: none; height: 34px; gap: 6px; padding: 0 12px; font-size: 13.5px; }
        .mbar .nav-i .e { width: auto; font-size: 16px; }
        .fp { flex-direction: column; }
        .fp-main { padding: 0 16px 120px; }
        .st { gap: 14px; }
        .st-th { width: 84px; height: 64px; }
        .rd { display: block; height: auto; }
        .rd-list { overflow: visible; border-right: 0; }
        .rd-detail { display: none; height: 100vh; }
        .rd-top { padding: 10px 16px 0; }
        .rd.m-open .rd-list { display: none; }
        .rd.m-open .rd-detail { display: flex; }
        .only-m { display: grid; }
        .keys { display: none; }
      }

      /* ---------- Picker (verbatim from PICKER.md) ---------- */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }
      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }
      /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
      }
      .proto-picker-item {
        position: relative; /* sits above the highlight */
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition: color 150ms ease-out;
      }
      .proto-picker-item:hover {
        color: rgba(255, 255, 255, 0.85);
      }
      .proto-picker-item:active {
        transform: scale(0.97);
      }
      .proto-picker-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.4);
        outline-offset: 2px;
      }
      .proto-picker-item[data-active] {
        color: #fff;
      }
      .proto-picker-divider {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.12);
      }
      .proto-picker-replay {
        padding: 0 10px;
        font-size: 14px;
      }
      .proto-picker[data-position="top"] {
        bottom: auto;
        top: 24px;
      }
    </style>
  </head>
