        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        xlogo:
          '<path fill="currentColor" stroke="none" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>',
        list: '<line x1="9" x2="21" y1="6" y2="6"/><line x1="9" x2="21" y1="12" y2="12"/><line x1="9" x2="21" y1="18" y2="18"/><line x1="4" x2="4.01" y1="6" y2="6"/><line x1="4" x2="4.01" y1="12" y2="12"/><line x1="4" x2="4.01" y1="18" y2="18"/>',
        rows: '<line x1="3" x2="21" y1="5" y2="5"/><line x1="3" x2="21" y1="10" y2="10"/><line x1="3" x2="21" y1="15" y2="15"/><line x1="3" x2="21" y1="20" y2="20"/>',
        cards: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
        featured: '<rect x="3" y="3" width="18" height="10" rx="1.5"/><line x1="3" x2="21" y1="17" y2="17"/><line x1="3" x2="14" y1="21" y2="21"/>',
        tiles: '<rect x="3" y="4" width="8" height="6" rx="1"/><rect x="13" y="4" width="8" height="6" rx="1"/><rect x="3" y="14" width="8" height="6" rx="1"/><rect x="13" y="14" width="8" height="6" rx="1"/>',
        grip: '<g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></g>',
        plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
        close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
        pencil: '<path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/>',
        trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
        sliders:
          '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
        arrow: '<path d="M7 17 17 7"/><path d="M7 7h10v10"/>',
        check: '<path d="m5 12 5 5L20 7"/>',
        refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
        chevL: '<path d="m15 18-6-6 6-6"/>',
        chevR: '<path d="m9 18 6-6-6-6"/>',
        chevU: '<path d="m18 15-6-6-6 6"/>',
        chevD: '<path d="m6 9 6 6 6-6"/>',
        store: '<path d="M3 9 4.5 4h15L21 9"/><path d="M3 9h18v1.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        grid: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
        book: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        admin: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/>',
        pin: '<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
        activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'
      };
      const icon = (name, size = 16) =>
        `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

      // Feed content is untrusted: every string is escaped and only https links render.
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const href = (u) => (/^https:\/\//.test(u) ? esc(u) : '#');

      const unread = (i) => i.t > S.lastVisit;
      function rel(i) {
        if (i.ago) return i.ago;
        const d = NOW - i.t;
        if (d < 36e5) return `${Math.max(1, Math.round(d / 6e4))}m ago`;
        if (d < DAY) return `${Math.round(d / 36e5)}h ago`;
        if (d < 7 * DAY) return `${Math.round(d / DAY)}d ago`;
        return short(i.t);
      }
      function short(t) {
        const dt = new Date(t);
        const opts = { month: 'short', day: 'numeric' };
        if (dt.getFullYear() !== new Date(NOW).getFullYear()) opts.year = 'numeric';
        return dt.toLocaleDateString('en-US', opts);
      }
      const time = (i) =>
        `<time datetime="${esc(i.date)}" title="${esc(new Date(i.t).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }))}">${esc(rel(i))}</time>`;
      const src = (i) => SOURCES[i.source].label;

      function pills(i, maxAreas = 2) {
        const types = i.categories.filter((c) => TYPE_OF.has(c)).map((c) => TYPE_OF.get(c));
        const areas = i.categories.filter(isArea);
        const version = i.categories.find(isVersion);
        return [
          ...types.map((t) => `<span class="pill ${t.tone ? 'pill--' + t.tone : ''}">${esc(t.label)}</span>`),
          ...areas.slice(0, maxAreas).map((a) => `<span class="pill">${esc(a)}</span>`),
          maxAreas && areas.length > maxAreas ? `<span class="pill">+${areas.length - maxAreas}</span>` : '',
          version ? `<span class="pill pill--version">${esc(version)}</span>` : ''
        ].join('');
      }

      /* ===== Widget data and layouts (shared by every variant) ===== */
      function widgetItems(w) {
        if (w.type === 'videos') return ITEMS.filter((i) => w.channels.has(i.source));
        if (w.type !== 'feed') return ITEMS.filter((i) => i.source === w.type);
        return ITEMS.filter(
          (i) =>
            w.sources.has(i.source) &&
            (i.source !== 'changelog' ||
              ((!w.types.size || i.categories.some((c) => w.types.has(c))) &&
                (!w.area || i.categories.includes(w.area)) &&
                (!w.version || i.categories.includes(w.version)))) &&
            (!w.unreadOnly || unread(i))
        );
      }
      const isFeedType = (w) => !['x', 'links', 'store', 'pins'].includes(w.type);
      const unreadCount = (w) => (isFeedType(w) ? widgetItems(w).filter(unread).length : 0);
      function feedSummary(w) {
        if (w.type === 'store') return `${w.store}.myshopify.com`;
        if (w.type === 'pins') return `${w.pins.length} ${w.pins.length === 1 ? 'link' : 'links'}`;
        if (w.type === 'videos') return w.channels.size === VIDEO_SOURCES.length ? 'All channels' : [...w.channels].map((id) => SOURCES[id].label).join(', ');
        if (w.type !== 'feed') return WT[w.type].desc;
        const all = w.sources.size === Object.keys(SOURCES).length;
        return [
          all ? 'All sources' : [...w.sources].map((id) => SOURCES[id].label).join(', ') || 'No sources',
          [...w.types].map((t) => TYPE_OF.get(t).label).join(', '),
          w.area,
          w.version,
          w.unreadOnly && 'Unread only'
        ]
          .filter(Boolean)
          .join(' · ');
      }

      const tile = (small) => `<span class="tile ${small ? 'tile--sm' : ''}"><span class="tile__play">${icon('play', small ? 10 : 13)}</span></span>`;
      const dot = (i) => `<span class="dot ${unread(i) ? '' : 'dot--off'}" ${unread(i) ? 'title="New since your last visit"' : ''}></span>`;

      function llRow(i, showSource) {
        const video = i.stream === 'videos';
        return `<li class="ll__row ${i.action ? 'is-action' : ''} ${unread(i) ? '' : 'is-read'}"><a href="${href(i.link)}">
          ${video ? tile(true) : ''}
          <span class="ll__body">
            <span class="meta">${unread(i) ? dot(i) : ''}${showSource ? `<b>${esc(src(i))}</b><span aria-hidden="true">·</span>` : ''}${time(i)}</span>
            <span class="ll__title">${esc(i.title)}</span>
            ${i.excerpt ? `<span class="ll__ex">${esc(i.excerpt)}</span>` : ''}
            ${i.categories.length ? `<span class="pills">${pills(i)}</span>` : ''}
          </span>
        </a></li>`;
      }
      // Compact rows flag action items with a colored mark instead of a pill, so titles keep the width.
      function actionFlag(i) {
        const c = i.categories.find((c) => ACTION.includes(c));
        if (!c) return '';
        const t = TYPE_OF.get(c);
        return `<span class="flag flag--${t.tone}" title="${esc(t.label)}" aria-label="${esc(t.label)}"></span>`;
      }
      function lcRow(i, showSource) {
        return `<li class="lc__row"><a href="${href(i.link)}" title="${esc(i.title)}">
          ${dot(i)}${actionFlag(i)}<span class="lc__title">${esc(i.title)}</span>
          ${showSource ? `<span class="lc__src">${esc(src(i))}</span>` : ''}<span class="lc__date">${time(i)}</span>
        </a></li>`;
      }
      function lCard(i) {
        return `<a class="lcard ${i.action ? 'is-action' : ''}" href="${href(i.link)}">
          ${i.categories.length ? `<span class="pills">${pills(i, 1)}</span>` : ''}
          <span class="lcard__title">${esc(i.title)}</span>
          ${i.excerpt ? `<span class="lcard__ex">${esc(i.excerpt)}</span>` : ''}
          <span class="meta">${unread(i) ? dot(i) : ''}${time(i)}</span>
        </a>`;
      }
      function vt(i, showSource = true) {
        return `<a class="vt" href="${href(i.link)}">${tile()}<span class="vt__title">${esc(i.title)}</span><span class="meta">${showSource ? `<b>${esc(src(i))}</b><span aria-hidden="true">·</span>` : ''}${time(i)}</span></a>`;
      }
      function lFeat(i, showSource) {
        if (i.stream === 'videos') return `<div class="lfeat">${vt(i, showSource)}</div>`;
        return `<a class="lfeat" href="${href(i.link)}">
          <span class="meta">${unread(i) ? dot(i) : ''}${showSource ? `<b>${esc(src(i))}</b><span aria-hidden="true">·</span>` : ''}${time(i)}</span>
          <span class="lfeat__title">${esc(i.title)}</span>
          ${i.excerpt ? `<span class="lfeat__ex">${esc(i.excerpt)}</span>` : ''}
        </a>`;
      }

      function storeBody(w) {
        const s = STORES[w.store];
        const domain = `${w.store}.myshopify.com`;
        const stats = [
          ['Products', s.products.toLocaleString('en-US')],
          ['Collections', s.collections.toLocaleString('en-US')],
          ['Shipping countries', s.ships],
          ['Currency', s.currency]
        ];
        const theme = `<div class="st__theme"><span class="st__key">Theme</span><b>${s.theme} ${s.version}</b>${
          s.latest === s.version ? '<span class="pill pill--green">Up to date</span>' : `<span class="pill pill--amber">${s.latest} available</span>`
        }</div>`;
        return `<div class="st">
          <div class="st__head">
            <span class="st__mono" aria-hidden="true">${s.name
              .split(' ')
              .slice(0, 2)
              .map((x) => x[0])
              .join('')}</span>
            <span class="st__name"><b>${domain}</b><small>Detected ${rel({ t: NOW - s.seen })}</small></span>
            <a class="iconbtn" href="https://${domain}" title="Open storefront" aria-label="Open ${s.name} storefront">${icon('store', 14)}</a>
            <a class="iconbtn" href="https://admin.shopify.com/store/${w.store}" title="Open admin" aria-label="Open ${s.name} admin">${icon('admin', 14)}</a>
          </div>
          ${
            w.layout === 'compact'
              ? `<dl class="st__rows">${stats.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`
              : `<div class="st__grid">${stats.map(([k, v]) => `<div class="st__tile"><span class="st__val">${v}</span><span class="st__key">${k}</span></div>`).join('')}</div>`
          }
          ${theme}
          <p class="ctl__hint">Public storefront data from /meta.json, refreshed when the tab opens.</p>
        </div>`;
      }
      function pinsBody(w) {
        if (!w.pins.length) return `<div class="wempty"><p>No pinned links yet.</p></div>`;
        if (w.layout === 'grid')
          return `<div class="lk">${w.pins.map(([label, url]) => `<a href="${href(url)}" title="${esc(hostPath(url))}"><span class="w__icon">${icon('pin', 14)}</span>${esc(label)}</a>`).join('')}</div>`;
        return `<ul class="lkl">${w.pins
          .map(([label, url]) => `<li><a href="${href(url)}"><span class="w__icon">${icon('pin', 14)}</span><span style="min-width:0"><b>${esc(label)}</b><small class="ellipsis">${esc(hostPath(url))}</small></span></a></li>`)
          .join('')}</ul>`;
      }

      function body(w, limit) {
        if (w.type === 'store') return storeBody(w);
        if (w.type === 'pins') return pinsBody(w);
        if (w.type === 'x') {
          if (w.layout === 'compact')
            return `<div class="xc"><div class="filters">${X_ACCOUNTS.map(([h]) => `<a class="chip" href="https://x.com/${h}">@${h}</a>`).join('')}</div><p class="ctl__hint">X has no public feed, so accounts open on x.com.</p></div>`;
          return `<ul>${X_ACCOUNTS.map(
            ([h, d]) => `<li><a class="xl__row" href="https://x.com/${h}"><span class="xl__logo">${icon('xlogo', 13)}</span><span><b>@${h}</b><small>${d}</small></span>${icon('arrow', 13)}</a></li>`
          ).join('')}</ul>`;
        }
        if (w.type === 'links') {
          if (w.layout === 'list')
            return `<ul class="lkl">${LINKS.map(([name, host, url, ic]) => `<li><a href="${url}"><span class="w__icon">${icon(ic, 15)}</span><span><b>${name}</b><small>${host}</small></span></a></li>`).join('')}</ul>`;
          return `<div class="lk">${LINKS.map(([name, , url, ic]) => `<a href="${url}"><span class="w__icon">${icon(ic, 15)}</span>${name}</a>`).join('')}</div>`;
        }
        const list = widgetItems(w);
        if (!list.length)
          return `<div class="wempty"><p>${w.type === 'feed' ? 'Nothing matches these filters.' : 'No channels selected.'}</p></div>`;
        const items = list.slice(0, limit);
        const showSource = (w.type === 'feed' && w.sources.size > 1) || (w.type === 'videos' && w.channels.size > 1);
        switch (w.layout) {
          case 'compact':
            return `<ol>${items.map((i) => lcRow(i, showSource)).join('')}</ol>`;
          case 'cards':
            return `<div class="lcards">${items.map(lCard).join('')}</div>`;
          case 'grid':
            return `<div class="lgrid">${items.map((i) => vt(i, showSource)).join('')}</div>`;
          case 'featured': {
            const [first, ...rest] = items;
            return lFeat(first, showSource) + `<ol>${rest.map((i) => lcRow(i, showSource)).join('')}</ol>`;
          }
          default:
            return `<ol>${items.map((i) => llRow(i, showSource)).join('')}</ol>`;
        }
      }

      /* ===== Shared controls: feed selections and filters, video channels ===== */
      const showSub = (w) => w.type === "feed" || w.type === "videos";
      const hasControls = (w) => ['feed', 'videos', 'store', 'pins'].includes(w.type);
      const chip = (w, act, v, label, on) =>
        `<button class="chip" data-act="${act}" data-w="${w.id}" data-v="${esc(v)}" data-k="${act}-${w.id}-${esc(v)}" aria-pressed="${on}">${esc(label)}</button>`;
      function controls(w) {
        if (w.type === 'store')
          return `<div class="ctl"><p class="label">Store</p>
            <select class="select" data-act="store" data-w="${w.id}" data-k="store-${w.id}" aria-label="Store">${Object.entries(STORES)
              .map(([id, s]) => `<option value="${id}" ${w.store === id ? 'selected' : ''}>${s.name}</option>`)
              .join('')}</select>
            <p class="ctl__hint">Stores Alfred detected while you browsed.</p></div>`;
        if (w.type === 'pins')
          return `<div class="ctl"><p class="label">Links</p>
            <ul class="pinlist">${w.pins
              .map(
                ([label, url], k) =>
                  `<li><span class="pinlist__text"><b>${esc(label)}</b><small>${esc(hostPath(url))}</small></span><button class="iconbtn" data-act="pinRemove" data-w="${w.id}" data-v="${k}" data-k="pinrm-${w.id}-${k}" aria-label="Remove ${esc(label)}">${icon('close', 12)}</button></li>`
              )
              .join('')}</ul>
            <div class="pinform">
              <input class="input" data-pin="label" placeholder="Label" aria-label="Link label">
              <input class="input" data-pin="url" placeholder="https://admin.shopify.com/store/…" aria-label="Link URL">
              <button class="btn btn--sm" data-act="pinAdd" data-w="${w.id}" data-k="pinadd-${w.id}">${icon('plus', 13)} Add link</button>
            </div></div>`;
        if (w.type === 'videos')
          return `<div class="ctl"><p class="label">Channels</p><div class="filters">${VIDEO_SOURCES.map((id) => chip(w, 'vch', id, SOURCES[id].label, w.channels.has(id))).join('')}</div></div>`;
        if (w.type !== 'feed') return '';
        return `<div class="ctl">
          <p class="label">Sources</p>
          <div class="filters">${Object.keys(SOURCES).map((id) => chip(w, 'fsrc', id, SOURCES[id].label, w.sources.has(id))).join('')}</div>
          <p class="label">Changelog filters</p>
          <div class="filters">${TYPES.map(([k, l]) => chip(w, 'ftype', k, l, w.types.has(k))).join('')}</div>
          <div class="filters">
            <select class="select ${w.area ? 'select--on' : ''}" data-act="farea" data-w="${w.id}" data-k="farea-${w.id}" aria-label="Area">
              <option value="">All areas</option>${AREAS.map((a) => `<option ${w.area === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
            </select>
            <select class="select ${w.version ? 'select--on' : ''}" data-act="fver" data-w="${w.id}" data-k="fver-${w.id}" aria-label="API version">
              <option value="">Any API version</option>${VERSIONS.map((v) => `<option ${w.version === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}
            </select>
            <label class="switch-label"><input type="checkbox" class="switch" data-act="funread" data-w="${w.id}" data-k="funread-${w.id}" ${w.unreadOnly ? 'checked' : ''}>Unread only</label>
          </div>
          <p class="ctl__hint">Type, area and version narrow changelog entries. Other sources show in full.</p>
        </div>`;
      }
      const layoutIcons = (w) =>
        `<div class="iseg" role="group" aria-label="Layout">${WT[w.type].layouts
          .map(
            (l) =>
              `<button data-act="layout" data-w="${w.id}" data-v="${l}" data-k="lay-${w.id}-${l}" aria-pressed="${w.layout === l}" title="${LAYOUTS[l][0]}" aria-label="${LAYOUTS[l][0]} layout">${icon(LAYOUTS[l][1], 13)}</button>`
          )
          .join('')}</div>`;
      const layoutSeg = (w) =>
        `<div class="seg">${WT[w.type].layouts
          .map((l) => `<button data-act="layout" data-w="${w.id}" data-v="${l}" data-k="lay-${w.id}-${l}" aria-pressed="${w.layout === l}">${LAYOUTS[l][0]}</button>`)
          .join('')}</div>`;
      const catalogItems = (cls) =>
        Object.entries(WT)
          .map(
            ([type, t]) =>
              `<button class="${cls}" data-act="add" data-v="${type}" data-k="add-${type}"><span class="w__icon">${icon(t.icon, 14)}</span><span><b>${t.name}</b><small>${t.desc}</small></span></button>`
          )
          .join('');
      const status = () => `<span class="status">Updated 4 min ago</span>`;
      const brand = () => `<div class="brand"><img src="https://bucket.alfred.uptek.com/logo-settings.png" alt=""><span>Shopify updates</span></div>`;

      /* ===== Variant 1: Bento ===== */
      const SIZES = [
        ['S', 'Small'],
        ['T', 'Tall'],
        ['M', 'Medium'],
        ['L', 'Large'],
        ['W', 'Wide']
      ];
      function bentoWidget(w, n, all) {
        const t = WT[w.type];
        const cnt = unreadCount(w);
        const e = UI.editing;
        const tools = e
          ? `<button class="iconbtn" data-act="remove" data-w="${w.id}" data-k="rm-${w.id}" aria-label="Remove widget" title="Remove">${icon('close', 14)}</button>`
          : `${layoutIcons(w)}${hasControls(w) ? `<span class="tools-sep"></span><button class="iconbtn" data-act="toggle" data-w="${w.id}" data-k="tg-${w.id}" aria-expanded="${w.open}" aria-label="Widget settings" title="Widget settings">${icon('filter', 13)}</button>` : ''}`;
        const editbar = `<div class="w__editbar ${UI.enter === "edit" ? "enter" : ""}">
            <div class="iseg iseg--text" role="group" aria-label="Size">${SIZES.map(
              ([s, label]) =>
                `<button data-act="size" data-w="${w.id}" data-v="${s}" data-k="size-${w.id}-${s}" aria-pressed="${w.size === s}" title="${label}">${s}</button>`
            ).join('')}</div>
            <span style="margin-left:auto"></span>
            <button class="iconbtn" data-act="move" data-w="${w.id}" data-v="-1" data-k="mvl-${w.id}" aria-label="Move earlier" ${n === 0 ? 'disabled' : ''}>${icon('chevL', 14)}</button>
            <button class="iconbtn" data-act="move" data-w="${w.id}" data-v="1" data-k="mvr-${w.id}" aria-label="Move later" ${n === all - 1 ? 'disabled' : ''}>${icon('chevR', 14)}</button>
          </div>`;
        return `<article class="w size--${w.size} anim ${UI.fresh === w.id ? 'enter' : ''} ${e ? 'w--edit' : ''}" style="--i:${n}" data-drop="${w.id}" ${e ? `draggable="true" data-drag="${w.id}"` : ''}>
          <header class="w__head">
            ${e ? `<span class="w__grip">${icon('grip', 14)}</span>` : ''}
            <span class="w__icon">${icon(t.icon, 13)}</span>
            <h2 class="w__title">${esc(w.title)}</h2>${cnt ? `<span class="count">${cnt}</span>` : ''}
            <div class="w__tools">${tools}</div>
          </header>
          ${e ? editbar : ''}
          ${!e && w.open ? `<div class="w__controls ${UI.enter === 'ctl-' + w.id ? 'enter' : ''}">${controls(w)}</div>` : !e && showSub(w) ? `<p class="w__sub">${esc(feedSummary(w))}</p>` : ''}
          <div class="w__body scroll" data-scroll="b-${w.id}">${body(w, 40)}</div>
        </article>`;
      }
      function vBento() {
        const B = board();
        return `<div class="v-bento">
          <header class="top">
            ${brand()}
            <div class="top__end">${
              UI.editing
                ? `<span class="status">Drag widgets to reorder</span>
              <div class="pop-anchor"><button class="btn" data-act="addMenu" data-k="addMenu" aria-expanded="${UI.addOpen}">${icon('plus', 14)} Add widget</button>
                ${UI.addOpen ? `<div class="menu ${UI.enter === 'add' ? 'enter' : ''}" role="menu">${catalogItems('menu__item')}</div>` : ''}</div>
              <button class="btn btn--primary" data-act="edit" data-k="edit">Done</button>`
                : `${status()}<button class="btn btn--ghost btn--sm" data-act="markread" data-k="markread">${icon('check', 14)} Mark all read</button>
              <button class="btn" data-act="edit" data-k="edit">${icon('pencil', 13)} Edit dashboard</button>`
            }</div>
          </header>
          <div class="bento">${B.map((w, n) => bentoWidget(w, n, B.length)).join('')}</div>
        </div>`;
      }

      /* ===== Variant 2: Deck ===== */
      function deckCol(w, n, all) {
        const t = WT[w.type];
        const cnt = unreadCount(w);
        return `<section class="col ${w.width === 'wide' ? 'col--wide' : ''} anim ${UI.fresh === w.id ? 'enter' : ''}" style="--i:${n}" id="col-${w.id}" data-drop="${w.id}">
          <header class="col__head" draggable="true" data-drag="${w.id}" title="Drag to reorder">
            <span class="w__icon">${icon(t.icon, 13)}</span>
            <h2 class="w__title">${esc(w.title)}</h2>${cnt ? `<span class="count">${cnt}</span>` : ''}
            <div class="w__tools"><button class="iconbtn" data-act="toggle" data-w="${w.id}" data-k="tg-${w.id}" aria-expanded="${w.open}" aria-label="Column options" title="Column options">${icon('sliders', 14)}</button></div>
          </header>
          ${
            w.open
              ? `<div class="col__opts ${UI.enter === 'ctl-' + w.id ? 'enter' : ''}">
            <div class="opt"><span class="label">Layout</span>${layoutSeg(w)}</div>
            <div class="opt"><span class="label">Width</span><div class="seg">${['narrow', 'wide']
              .map((x) => `<button data-act="width" data-w="${w.id}" data-v="${x}" data-k="wd-${w.id}-${x}" aria-pressed="${w.width === x}">${x[0].toUpperCase() + x.slice(1)}</button>`)
              .join('')}</div></div>
            ${controls(w)}
            <div class="opt__row">
              <button class="btn btn--sm" data-act="move" data-w="${w.id}" data-v="-1" data-k="mvl-${w.id}" ${n === 0 ? 'disabled' : ''}>${icon('chevL', 13)} Move left</button>
              <button class="btn btn--sm" data-act="move" data-w="${w.id}" data-v="1" data-k="mvr-${w.id}" ${n === all - 1 ? 'disabled' : ''}>Move right ${icon('chevR', 13)}</button>
              <button class="btn btn--sm btn--danger" data-act="remove" data-w="${w.id}" data-k="rm-${w.id}">${icon('trash', 13)} Remove</button>
            </div>
          </div>`
              : showSub(w)
                ? `<p class="w__sub" style="padding-top:8px">${esc(feedSummary(w))}</p>`
                : ''
          }
          <div class="col__body scroll" data-scroll="b-${w.id}">${body(w, 40)}</div>
        </section>`;
      }
      function vDeck() {
        const B = board();
        return `<div class="v-deck">
          <nav class="rail" aria-label="Columns">
            <img class="rail__logo" src="https://bucket.alfred.uptek.com/logo-settings.png" alt="Alfred">
            <div class="rail__cols">${B.map(
              (w) =>
                `<button class="rail__btn" data-act="jump" data-w="${w.id}" data-k="jump-${w.id}" title="${esc(w.title)}" aria-label="Go to ${esc(w.title)}">${icon(WT[w.type].icon, 17)}${unreadCount(w) ? '<span class="rail__dot"></span>' : ''}</button>`
            ).join('')}</div>
            <button class="rail__btn rail__add" data-act="deckAdd" data-k="deckAdd-rail" title="Add column" aria-label="Add column">${icon('plus', 16)}</button>
            <div class="rail__end">
              <button class="rail__btn" data-act="markread" data-k="markread" title="Mark all as read" aria-label="Mark all as read">${icon('check', 17)}</button>
              <span class="rail__btn" title="Updated 4 min ago" style="cursor:default">${icon('refresh', 15)}</span>
            </div>
          </nav>
          <div class="deck__board scroll" data-scroll="board">
            ${B.map((w, n) => deckCol(w, n, B.length)).join('')}
            <section class="col col--ghost anim" style="--i:${B.length}" id="col-add">${
              UI.deckAdd
                ? `<div class="col__head" style="cursor:default"><h2 class="w__title">Add column</h2><div class="w__tools"><button class="iconbtn" data-act="deckAdd" data-k="deckAdd-close" aria-label="Cancel">${icon('close', 14)}</button></div></div>
                   <div class="ghost-list scroll">${catalogItems('menu__item')}</div>`
                : `<button class="ghost-add" data-act="deckAdd" data-k="deckAdd">${icon('plus', 20)}<span>Add column</span></button>`
            }</section>
          </div>
        </div>`;
      }

      /* ===== Variant 3: Gallery ===== */
      const thumb = (l) => `<span class="thumb thumb--${l}" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
      const galleryCols = () => {
        const room = innerWidth - (UI.drawer ? 400 : 0);
        return room > 1180 ? 3 : room > 760 ? 2 : 1;
      };
      function galWidget(w, n) {
        const t = WT[w.type];
        const cnt = unreadCount(w);
        return `<article class="w g anim ${UI.fresh === w.id ? 'enter' : ''} ${UI.sel === w.id ? 'is-sel' : ''}" style="--i:${n}" data-drop="${w.id}">
          <header class="w__head">
            <span class="w__icon">${icon(t.icon, 13)}</span>
            <h2 class="w__title">${esc(w.title)}</h2>${cnt ? `<span class="count">${cnt}</span>` : ''}
            <div class="w__tools"><button class="iconbtn g__edit" data-act="inspect" data-w="${w.id}" data-k="ed-${w.id}" aria-label="Edit ${esc(w.title)}" title="Edit widget">${icon('pencil', 13)}</button></div>
          </header>
          ${showSub(w) ? `<p class="w__sub">${esc(feedSummary(w))}</p>` : ''}
          <div class="w__body">${body(w, w.count)}</div>
          ${t.home ? `<a class="g__foot" href="${t.home[1]}">${t.home[0]} ${icon('arrow', 12)}</a>` : ''}
        </article>`;
      }
      function inspector(w) {
        const t = WT[w.type];
        return `<label class="field"><span class="label">Title</span><input class="input" data-act="rename" data-w="${w.id}" data-k="rename-${w.id}" value="${esc(w.title)}" placeholder="${esc(t.name)}"></label>
          <div class="field"><span class="label">Layout</span><div class="lays">${t.layouts
            .map((l) => `<button class="lay" data-act="layout" data-w="${w.id}" data-v="${l}" data-k="lay-${w.id}-${l}" aria-pressed="${w.layout === l}">${thumb(l)}<span>${LAYOUTS[l][0]}</span></button>`)
            .join('')}</div></div>
          ${
            !isFeedType(w)
              ? ''
              : `<div class="field"><span class="label">Show</span><div class="seg">${[4, 6, 10]
                  .map((c) => `<button data-act="count" data-w="${w.id}" data-v="${c}" data-k="cnt-${w.id}-${c}" aria-pressed="${w.count === c}">${c} items</button>`)
                  .join('')}</div></div>`
          }
          ${controls(w)}
          <button class="btn btn--danger btn--block" data-act="remove" data-w="${w.id}" data-k="rm-${w.id}">${icon('trash', 14)} Remove widget</button>`;
      }
      function drawer() {
        const w = UI.sel && findW(UI.sel);
        const B = board();
        const head = w
          ? `<button class="iconbtn" data-act="back" data-k="back" aria-label="Back to all widgets">${icon('chevL', 16)}</button><h2>Edit widget</h2>`
          : `<div class="seg">${[
              ['list', 'Your widgets'],
              ['add', 'Add widgets']
            ]
              .map(([id, label]) => `<button data-act="tab" data-v="${id}" data-k="tab-${id}" aria-pressed="${UI.tab === id}">${label}</button>`)
              .join('')}</div>`;
        const content = w
          ? inspector(w)
          : UI.tab === 'list'
            ? `<p class="drawer__hint">Drag to reorder, or pick a widget to change its layout and filters.</p>
              <ol class="wlist">${B.map(
                (x, i) => `<li class="wlist__item" draggable="true" data-drag="${x.id}" data-drop="${x.id}">
                <span class="w__grip">${icon('grip', 14)}</span>
                <button class="wlist__main" data-act="inspect" data-w="${x.id}" data-k="ins-${x.id}"><span class="w__icon">${icon(WT[x.type].icon, 13)}</span><span><b>${esc(x.title)}</b><small>${LAYOUTS[x.layout][0]} · ${esc(feedSummary(x))}</small></span></button>
                <button class="iconbtn" data-act="move" data-w="${x.id}" data-v="-1" data-k="mvu-${x.id}" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${icon('chevU', 14)}</button>
                <button class="iconbtn" data-act="move" data-w="${x.id}" data-v="1" data-k="mvd-${x.id}" aria-label="Move down" ${i === B.length - 1 ? 'disabled' : ''}>${icon('chevD', 14)}</button>
              </li>`
              ).join('')}</ol>`
            : `<div class="catalog">${Object.entries(WT)
                .map(
                  ([type, t]) => `<div class="cat">${thumb(t.layouts[0])}<div class="cat__body"><b>${t.name}</b><small>${t.desc}</small><small>${t.layouts.map((l) => LAYOUTS[l][0]).join(' · ')}</small></div>
                  <button class="btn btn--sm" data-act="add" data-v="${type}" data-k="add-${type}">${icon('plus', 13)} Add</button></div>`
                )
                .join('')}</div>`;
        return `<aside class="drawer ${UI.enter === 'drawer' ? 'enter' : ''}" role="dialog" aria-label="Customize new tab">
          <div class="drawer__head">${head}<button class="iconbtn" data-act="closeDrawer" data-k="closeDrawer" aria-label="Close">${icon('close', 16)}</button></div>
          <div class="drawer__body scroll" data-scroll="drawer">${content}</div>
        </aside>`;
      }
      function vGallery() {
        const n = galleryCols();
        const cols = Array.from({ length: n }, () => []);
        board().forEach((w, i) => cols[i % n].push(galWidget(w, i)));
        return `<div class="v-gal ${UI.drawer ? 'has-drawer' : ''}">
          <header class="top">
            ${brand()}
            <div class="top__end">${status()}
              <button class="btn btn--ghost btn--sm" data-act="markread" data-k="markread">${icon('check', 14)} Mark all read</button>
              <button class="btn" data-act="customize" data-k="customize" aria-expanded="${UI.drawer}">${icon('sliders', 14)} Customize</button>
            </div>
          </header>
          <div class="masonry">${cols.map((c) => `<div class="masonry__col">${c.join('')}</div>`).join('')}</div>
        </div>${UI.drawer ? drawer() : ''}`;
      }

      // Each variant runs from the picker's mount (fresh view state) or from rerender (after an interaction).
      const variants = [vBento, vDeck, vGallery].map((render) => () => {
        if (!S.rerender) resetUI();
        const html = render();
        UI.enter = null;
        return html;
      });

      /* Picker wiring: verbatim from the prototype skill's PICKER.md. */
      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = '';
        stage.classList.remove('static');
        // Clear first, render next frame, so entrance animations re-run.
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      // Enable the slide only after first paint, so load doesn't animate.
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

      /* Interactions: change state, then re-render statically, keeping focus, caret and scroll positions. */
      function rerender() {
        const a = document.activeElement;
        const key = a?.dataset?.k;
        const caret = a?.tagName === 'INPUT' && a.type !== 'checkbox' ? [a.selectionStart, a.selectionEnd] : null;
        const scrolls = [...stage.querySelectorAll('[data-scroll]')].map((el) => [el.dataset.scroll, el.scrollTop, el.scrollLeft]);
        S.rerender = true;
        stage.classList.add('static');
        const fresh = UI.fresh;
        stage.innerHTML = variants[current]();
        S.rerender = false;
        scrolls.forEach(([k, top, left]) => {
          const el = stage.querySelector(`[data-scroll="${k}"]`);
          if (el) Object.assign(el, { scrollTop: top, scrollLeft: left });
        });
        const el = key && stage.querySelector(`[data-k="${CSS.escape(key)}"]`);
        if (el) {
          el.focus({ preventScroll: true });
          if (caret && el.setSelectionRange) el.setSelectionRange(...caret);
        }
        if (UI.focusDrawer) {
          stage.querySelector('.drawer .drawer__body button, .drawer .drawer__body input')?.focus({ preventScroll: true });
          UI.focusDrawer = false;
        }
        if (fresh) {
          stage.querySelector(`[data-drop="${fresh}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
          UI.fresh = null;
        }
      }

      function act(name, el) {
        const v = el.dataset.v;
        const w = el.dataset.w && findW(el.dataset.w);
        const B = board();
        const tog = (set, x) => (set.has(x) ? set.delete(x) : set.add(x));
        switch (name) {
          case 'layout':
            w.layout = v;
            break;
          case 'size':
            w.size = v;
            break;
          case 'width':
            w.width = v;
            break;
          case 'count':
            w.count = Number(v);
            break;
          case 'toggle':
            w.open = !w.open;
            UI.enter = w.open ? 'ctl-' + w.id : null;
            break;
          case 'remove':
            B.splice(B.indexOf(w), 1);
            if (UI.sel === w.id) UI.sel = null;
            break;
          case 'move': {
            const i = B.indexOf(w);
            const j = i + Number(v);
            if (j < 0 || j >= B.length) return;
            B.splice(j, 0, B.splice(i, 1)[0]);
            break;
          }
          case 'add': {
            const nw = W(v, { size: { videos: 'W', changelog: 'L', store: 'M', pins: 'M' }[v] || 'S', count: 6 });
            B.push(nw);
            UI.fresh = nw.id;
            UI.addOpen = false;
            UI.deckAdd = false;
            if (current === 1) {
              nw.open = true;
              UI.enter = 'ctl-' + nw.id;
            }
            if (current === 2) UI.sel = nw.id;
            break;
          }
          case 'fsrc':
            tog(w.sources, v);
            break;
          case 'ftype':
            tog(w.types, v);
            break;
          case 'farea':
            w.area = el.value;
            break;
          case 'fver':
            w.version = el.value;
            break;
          case 'funread':
            w.unreadOnly = el.checked;
            break;
          case 'vch':
            tog(w.channels, v);
            break;
          case 'store':
            // Keep a custom title; follow the store name otherwise.
            if (w.title === STORES[w.store].name) w.title = STORES[el.value].name;
            w.store = el.value;
            break;
          case 'pinRemove':
            w.pins.splice(Number(v), 1);
            break;
          case 'pinAdd': {
            const form = el.closest('.pinform');
            const urlInput = form.querySelector('[data-pin="url"]');
            let url;
            try {
              url = new URL(urlInput.value.trim());
            } catch {}
            // Pins only accept https links, same rule as feed content.
            if (!url || url.protocol !== 'https:') {
              urlInput.setAttribute('aria-invalid', 'true');
              urlInput.focus();
              return;
            }
            w.pins.push([form.querySelector('[data-pin="label"]').value.trim() || url.hostname, url.href]);
            break;
          }
          case 'rename':
            w.title = el.value;
            break;
          case 'edit':
            UI.editing = !UI.editing;
            UI.enter = UI.editing ? "edit" : null;
            UI.addOpen = false;
            B.forEach((x) => (x.open = false));
            break;
          case 'addMenu':
            UI.addOpen = !UI.addOpen;
            UI.enter = UI.addOpen ? 'add' : null;
            break;
          case 'deckAdd':
            UI.deckAdd = !UI.deckAdd;
            if (UI.deckAdd) UI.fresh = 'add';
            break;
          case 'jump':
            document.getElementById('col-' + w.id)?.scrollIntoView({ inline: 'start', block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
            return;
          case 'customize':
            if (UI.drawer && !UI.sel) UI.drawer = false;
            else {
              UI.enter = UI.drawer ? null : 'drawer';
              Object.assign(UI, { drawer: true, sel: null, tab: 'list', focusDrawer: true });
            }
            break;
          case 'inspect':
            UI.enter = UI.drawer ? null : 'drawer';
            Object.assign(UI, { drawer: true, sel: w.id, focusDrawer: true });
            break;
          case 'tab':
            UI.tab = v;
            break;
          case 'back':
            UI.sel = null;
            UI.focusDrawer = true;
            break;
          case 'closeDrawer':
            Object.assign(UI, { drawer: false, sel: null });
            break;
          case 'markread':
            S.lastVisit = Date.now();
            break;
        }
        rerender();
      }

      stage.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el || /^(INPUT|SELECT)$/.test(el.tagName)) return;
        act(el.dataset.act, el);
      });
      stage.addEventListener('change', (e) => {
        const el = e.target.closest('[data-act]');
        if (el && el.dataset.act !== 'rename') act(el.dataset.act, el);
      });
      stage.addEventListener('input', (e) => {
        if (e.target.dataset.act === 'rename') act('rename', e.target);
        if (e.target.dataset.pin === 'url') e.target.removeAttribute('aria-invalid');
      });
      stage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.dataset.pin) act('pinAdd', e.target.closest('.pinform').querySelector('[data-act="pinAdd"]'));
      });

      // Drag to reorder: widgets in Bento edit mode, column headers in Deck, the widget list in Gallery's drawer.
      let dragId = null;
      const clearDrag = () => stage.querySelectorAll('.dragging, .drop-target').forEach((x) => x.classList.remove('dragging', 'drop-target'));
      stage.addEventListener('dragstart', (e) => {
        const el = e.target.closest?.('[data-drag]');
        if (!el) return;
        dragId = el.dataset.drag;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragId);
        el.closest('[data-drop]')?.classList.add('dragging');
      });
      stage.addEventListener('dragover', (e) => {
        const t = e.target.closest?.('[data-drop]');
        if (!dragId || !t) return;
        e.preventDefault();
        stage.querySelectorAll('.drop-target').forEach((x) => x !== t && x.classList.remove('drop-target'));
        if (t.dataset.drop !== dragId) t.classList.add('drop-target');
      });
      stage.addEventListener('drop', (e) => {
        const t = e.target.closest?.('[data-drop]');
        if (!dragId || !t) return;
        e.preventDefault();
        const B = board();
        const from = B.findIndex((w) => w.id === dragId);
        const to = B.findIndex((w) => w.id === t.dataset.drop);
        dragId = null;
        if (from < 0 || to < 0 || from === to) return clearDrag();
        B.splice(to, 0, B.splice(from, 1)[0]);
        rerender();
      });
      stage.addEventListener('dragend', () => {
        dragId = null;
        clearDrag();
      });

      document.addEventListener('click', (e) => {
        if (UI.addOpen && !e.target.closest('.pop-anchor')) {
          UI.addOpen = false;
          rerender();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (UI.addOpen) UI.addOpen = false;
        else if (UI.deckAdd) UI.deckAdd = false;
        else if (UI.drawer) Object.assign(UI, { drawer: false, sel: null });
        else if (UI.editing) UI.editing = false;
        else return;
        rerender();
      });
      let lastCols = 0;
      addEventListener('resize', () => {
        if (current === 2 && galleryCols() !== lastCols) rerender();
        lastCols = galleryCols();
      });
    </script>
  </body>
</html>
