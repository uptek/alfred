      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {

        color: var(--text);

        font-weight: 500;

        line-height: 20px;

      .st-th { flex: none; width: 108px; height: 80px; margin-top: 4px; border-radius: 10px; object-fit: cover; background: var(--hover); }

        position: relative;

        width: 22px;
        height: 22px;

        border-radius: 50%;

        font: 700 9.5px/22px var(--sans);

      .face + .face { margin-left: -6px; }

      .more { display: block; margin: 20px auto 0; padding: 10px 18px; border-radius: 999px; background: var(--hover); font-weight: 500; }
